name: Publish Windows

on:
  workflow_run:
    workflows: ["Verify Windows"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      verify_run_id:
        description: 'Verify Windows workflow run ID'
        required: true

env:
  APP_ID: 9MTTM2QDM94V

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest

    steps:
      - name: Download MSIX artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-msix
          path: msix
          run-id: ${{ inputs.verify_run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download metadata artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-metadata
          path: metadata
          run-id: ${{ inputs.verify_run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1

      - name: Configure Microsoft Store CLI
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} `
            --sellerId ${{ secrets.SELLER_ID }} `
            --clientId ${{ secrets.AZURE_AD_CLIENT_ID }} `
            --clientSecret ${{ secrets.AZURE_AD_CLIENT_SECRET }}

      - name: Upload package to submission
        shell: pwsh
        run: |
          $msixFile = (Get-ChildItem -Path msix -Filter "*.msix" | Select-Object -First 1).FullName
          Write-Host "Uploading package: $msixFile"
          msstore publish $msixFile --appId $env:APP_ID --noCommit

      - name: Update submission metadata
        shell: pwsh
        run: |
          Write-Host "Fetching current submission..."
          $output = msstore submission get $env:APP_ID 2>&1 | Out-String
          $jsonMatch = [regex]::Match($output, '(?s)\{.*\}')
          if (-not $jsonMatch.Success) {
            Write-Host "::error::Could not extract JSON from submission"
            exit 1
          }
          $current = $jsonMatch.Value | ConvertFrom-Json

          Write-Host "Loading release notes from metadata.json..."
          $updates = Get-Content -Raw "metadata/metadata.json" | ConvertFrom-Json

          foreach ($lang in $updates.listings.PSObject.Properties.Name) {
            $notes = $updates.listings.$lang.baseListing.releaseNotes
            if ($current.listings.$lang) {
              $current.listings.$lang.baseListing.releaseNotes = $notes
              Write-Host "Updated releaseNotes for $lang"
            }
          }

          $updatedJson = $current | ConvertTo-Json -Depth 20 -Compress
          Write-Host "Sending updated metadata..."
          $updatedJson | msstore submission updateMetadata $env:APP_ID --verbose

      - name: Publish submission
        shell: pwsh
        run: |
          Write-Host "Publishing submission to Microsoft Store..."
          msstore submission publish $env:APP_ID
