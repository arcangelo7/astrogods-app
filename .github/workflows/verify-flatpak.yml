name: Verify Flatpak

on:
  workflow_run:
    workflows: ["Build Flatpak"]
    types:
      - completed
  workflow_dispatch:

jobs:
  verify-flatpak:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.7
        with:
          manifest-path: it.astrogods.AstroGods.yml
          arch: ${{ matrix.arch }}
          build-bundle: false

      - name: Lint manifest
        run: flatpak-builder-lint manifest it.astrogods.AstroGods.yml

      - name: Lint repo
        continue-on-error: true
        run: flatpak-builder-lint repo repo
