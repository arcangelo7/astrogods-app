name: Publish Android

on:
  workflow_run:
    workflows: ["Verify Android"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      verify_run_id:
        description: 'Verify Android workflow run ID'
        required: true

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download AAB artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-aab
          run-id: ${{ inputs.verify_run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Write service account key
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"

      - name: Upload bundle, listing, images and release notes to Google Play
        run: |
          fastlane supply \
            --package_name com.astrogods.app \
            --aab app-release.aab \
            --track production \
            --release_status completed \
            --metadata_path android/fastlane/metadata/android \
            --json_key "$RUNNER_TEMP/play-service-account.json"
