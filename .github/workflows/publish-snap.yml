name: Publish Snap

on:
  workflow_run:
    workflows: ["Verify Snap"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      verify_run_id:
        description: 'Verify Snap workflow run ID'
        required: true

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest

    steps:
      - name: Download snap artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snap-${{ matrix.arch }}
          run-id: ${{ inputs.verify_run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find snap file
        id: find-snap
        run: echo "snap_file=$(ls astrogods_*.snap)" >> $GITHUB_OUTPUT

      - name: Publish to Snap Store
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.find-snap.outputs.snap_file }}
          release: stable
