name: Verify Android

on:
  workflow_run:
    workflows: ["Build Android"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Build Android workflow run ID'
        required: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-aab
          run-id: ${{ inputs.build_run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify AAB exists
        run: |
          if [ ! -f app-release.aab ]; then
            echo "AAB file not found"
            exit 1
          fi
          ls -la app-release.aab

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache bundletool
        id: cache-bundletool
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: bundletool.jar
          key: bundletool-1.18.3

      - name: Download bundletool
        if: steps.cache-bundletool.outputs.cache-hit != 'true'
        run: wget -q https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -O bundletool.jar

      - name: Verify AAB with bundletool
        run: java -jar bundletool.jar validate --bundle=app-release.aab

      - name: Re-upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-aab
          path: app-release.aab

      - name: Download release notes artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: whatsnew
          run-id: ${{ inputs.build_run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: whatsnew/

      - name: Re-upload release notes artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whatsnew
          path: whatsnew/
