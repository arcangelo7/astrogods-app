name: Build Android

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Build AAB
        env:
          KEYSTORE_FILE: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Extract release notes from commit
        id: release_notes
        run: |
          BODY=$(git log -1 --pretty=format:"%b")

          if [ -z "$BODY" ]; then
            NOTES_EN="Release ${{ github.ref_name }}"
            NOTES_IT="Release ${{ github.ref_name }}"
          elif echo "$BODY" | grep -q '^---EN---$'; then
            NOTES_EN=$(echo "$BODY" | sed -n '/^---EN---$/,/^---IT---$/p' | grep -v '^---' || echo "$BODY" | sed -n '/^---EN---$/,$p' | grep -v '^---')
            NOTES_IT=$(echo "$BODY" | sed -n '/^---IT---$/,$p' | grep -v '^---')

            [ -z "$NOTES_EN" ] && NOTES_EN="Release ${{ github.ref_name }}"
            [ -z "$NOTES_IT" ] && NOTES_IT="Release ${{ github.ref_name }}"
          else
            NOTES_EN="$BODY"
            NOTES_IT="$BODY"
          fi

          {
            echo "notes_en<<EOF"
            echo "$NOTES_EN"
            echo "EOF"
            echo "notes_it<<EOF"
            echo "$NOTES_IT"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create whatsnew directory
        run: |
          mkdir -p whatsnew
          echo "${{ steps.release_notes.outputs.notes_en }}" > whatsnew/whatsnew-en-US
          echo "${{ steps.release_notes.outputs.notes_it }}" > whatsnew/whatsnew-it-IT

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v6
        with:
          name: whatsnew
          path: whatsnew/
