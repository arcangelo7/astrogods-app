chooseAstrologicalPath: Nutrire per essere nutriti
faq1Answer: L'IA svolge un ruolo minore in AstroGods. Le interpretazioni sono scritte a mano e curate da Jacopo Trombetti e Arcangelo Massari. I calcoli astronomici utilizzano le Effemeridi Svizzere, le più precise al mondo. L'IA si limita ad assemblare i vari pezzi interpretativi in frasi di senso compiuto, niente di più.
faq1Question: L'intelligenza artificiale non rende le interpretazioni casuali?
faq2Answer: 'Secondo questo approccio interpretativo, la costituzione energetica umana si articola su sette chakra che corrispondono a sette pianeti, dalla Luna a Saturno. Oltre questi, la costituzione umana semplicemente non ha canali ricettivi nei confronti di potenze planetarie superiori. Questi pianeti hanno comunque un impatto, ma di tipo generazionale: per esempio, Plutone in Scorpione (1983-1995) caratterizza un''intera generazione. Sono più utili per studiare periodi storici che non individui e quindi non vengono inclusi.'
faq2Question: Perché non ci sono Urano, Nettuno e Plutone?
faq3Answer: 'La domificazione è il metodo con cui si calcolano le dodici Case astrologiche. La maggior parte delle app usa Placido, che divide il cielo in base al tempo creando Case disuguali che variano per latitudine: alcune possono essere enormi, altre minuscole. Noi utilizziamo Vehlow, che divide lo zodiaco in dodici Case uguali di 30 gradi ciascuna. Non ha senso simbolico dividere l''animo umano in parti disuguali: nessun ambito della vita è meno importante di un altro.'
faq3Question: Perché i pianeti sono in Case diverse rispetto ad altre app?
faq4Answer: 'L''Ascendente e le Case dipendono dall''ora esatta di nascita. L''intero tema ruota completamente in 24 ore. Senza l''ora di nascita, possiamo analizzare solo le posizioni planetarie nei segni, perdendo metà del quadro simbolico: le Case che descrivono in quali ambiti della vita si manifestano le energie planetarie.'
faq4Question: Perché l'ora di nascita è importante?
faq5Answer: Utilizziamo le Effemeridi Svizzere, le tavole astronomiche più precise al mondo. Sviluppate e mantenute da Astrodienst (astro.com), calcolano le posizioni planetarie esatte per qualsiasi data nella storia o nel futuro. Sono lo standard di riferimento per i software astrologici professionali.
faq5Question: Qual è la fonte dei calcoli astrologici?
faq6Answer: 'L''Egitto è la matrice ermetica della cultura occidentale. L''Astrologia oroscopica nacque ad Alessandria d''Egitto, dove il faraone Nechepso e il sacerdote Petosiris scrissero i testi fondamentali (~150-120 a.C.) da cui tutti gli astrologi greci e romani hanno attinto. Tolomeo, autore del Tetrabiblos (fondamento dell''Astrologia occidentale), lavorava ad Alessandria. Ermete Trismegisto, fusione del dio greco Hermes e del dio egizio Thoth, è considerato il fondatore di questa tradizione. L''Astrologia egizia non è una variante: è la fonte originale.'
faq6Question: Perché l'Astrologia egizia?
faq7Answer: 'No. Gli elementi astrologici hanno molteplici significati simbolici e declinarli nell''ambito di una determinata costituzione energetica richiede uno scambio tra anime, cuori e sensibilità. Inoltre, il Tema Natale rivela le potenzialità di una persona, ma non quanto queste siano state sviluppate o trascese: due individui con temi identici possono vivere in modi radicalmente diversi. Solo un astrologo, conoscendo la persona, può calibrare l''interpretazione.'
faq7Question: Questa app sostituisce il confronto con un astrologo?
