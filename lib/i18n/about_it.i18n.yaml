missionSectionTitle: La nostra missione
missionText: 'La nostra è innanzitutto una missione di ricerca: siamo i primi a essere curiosi di scoprire cosa è possibile fare con questo strumento. Utilizziamo un software che tiene in considerazione tutti i fattori contemporaneamente per raggiungere interpretazioni sempre più precise. AstroGods rende l''interpretazione astrologica più accessibile a chi non è esperto e allo stesso tempo semplifica il lavoro dell''astrologo: per quanto bravo e per quanto esperto, si trova a dover miscelare simbolicamente infiniti elementi. Avere uno strumento che li tenga tutti in considerazione permette di non scordarsi niente: un supporto che potenzia, non sostituisce, l''esperienza umana.'
storySectionTitle: La nostra storia
storyText: 'AstroGods nasce da un''amicizia. Arcangelo è sempre stato colpito dalla capacità di Jacopo di descrivere con precisione persone basandosi solo sulla loro data di nascita e di leggere momenti della sua vita con una profondità inspiegabile. Ha voluto portare sempre con sé quello sguardo e così è nato AstroGods: un tentativo di tradurre in algoritmo il metodo che Jacopo usa per decifrare la realtà attraverso l''Astrologia.'
teamMemberArcangeloDescription: Allievo di Jacopo e responsabile della parte tecnica di AstroGods. Appassionato di Astrologia, studia l'argomento dal 2016.
teamMemberArcangeloRole: Sviluppo tecnico
teamMemberArcangeloTitle: Arcangelo Massari
teamMemberCorradoDescription: Esploratore di vari percorsi di autoconoscenza, Corrado si occupa di far conoscere AstroGods al mondo e di creare ponti tra l'Astrologia e altre discipline.
teamMemberCorradoRole: Comunità
teamMemberCorradoTitle: Corrado Camponeschi
teamMemberJacopoDescription: Formato presso l'Accademia di Astrologia Egizia fondata da Pascal Fabio Patruno, Jacopo è un astrologo geniale, capace di computare a mente la sinastria tra due persone, memorizzando gradi e pianeti di temi che ha visto una sola volta nella sua vita.
