placidoIntroContent: |-
  Per chi non ha familiarità con i concetti di sfera celeste, equatore celeste ed eclittica, consigliamo di leggere prima i due articoli della sezione [Fondamenti di Astronomia](/codex/astronomy-fundamentals): [La sfera celeste](/codex/astronomy-fundamentals/celestial-sphere) e [Equatore celeste ed eclittica](/codex/astronomy-fundamentals/equator-ecliptic).

  ## Le case: dividere il cielo in dodici

  In Astrologia, il tema natale è diviso in dodici case. Ogni casa governa un ambito dell'esperienza: identità, risorse, comunicazione, famiglia, creatività e così via. I segni zodiacali e le case condividono il numero dodici, ma sono strutture distinte. I segni dividono l'[eclittica](/codex/astronomy-fundamentals/equator-ecliptic) in dodici segmenti uguali di 30 gradi. Le case la dividono in base alla posizione dell'osservatore sulla Terra in un momento specifico.

  La domanda che distingue un sistema di domificazione dall'altro è: come si effettua questa divisione?

  ## Il metodo di Placido

  Placido de Titis, un monaco olivetano del XVII secolo, propose un metodo basato sul tempo. Il suo ragionamento parte da un'osservazione semplice: ogni punto dell'eclittica sorge all'orizzonte orientale, sale fino al punto più alto al meridiano (il Medio Cielo), poi scende e tramonta all'orizzonte occidentale. Il tempo necessario per percorrere il tragitto dal sorgere alla culminazione è l'arco semi-diurno.

  Placido divide questo arco semi-diurno in tre intervalli di tempo uguali. I gradi dell'eclittica che corrispondono ai confini di un terzo e di due terzi diventano le cuspidi delle case. La stessa procedura si applica alla metà discendente (dalla culminazione al tramonto), producendo sei case sopra l'orizzonte e sei sotto.

  L'idea è intuitiva: il tempo che un grado impiega ad attraversare il cielo visibile viene suddiviso in parti uguali e ciascuna parte corrisponde a una casa.

  ## Perché produce case disuguali

  Il problema è che parti diverse dell'eclittica viaggiano a velocità diverse. Alcuni gradi zodiacali trascorrono molte ore sopra l'orizzonte; altri ne trascorrono molte meno. Questa asimmetria è causata da due fattori: l'inclinazione dell'eclittica rispetto all'equatore celeste e la latitudine geografica dell'osservatore.

  Quando Placido divide l'arco semi-diurno in segmenti temporali uguali e poi rimappa quei segmenti sull'eclittica, le case risultanti coprono un numero diverso di gradi. Una casa che contiene gradi di ascensione lunga (che sorgono lentamente) sarà ampia; una casa che contiene gradi di ascensione corta (che sorgono rapidamente) sarà stretta. A latitudini moderate come Roma, la differenza è sensibile. A latitudini elevate, diventa estrema.

  Se questi concetti non risultano immediatamente chiari, è del tutto normale: si tratta di meccanismi difficili da visualizzare senza un supporto grafico. Gli articoli che seguono sono pensati proprio per questo, con diagrammi interattivi che aiutano a farsi un'idea concreta del problema.

  ## Cosa segue

  Gli articoli di questa sezione costruiscono la comprensione astronomica necessaria per vedere esattamente come e perché questo accade:

  1. [Come la latitudine cambia il cielo](/codex/domification/understanding-placido/latitude-sky) mostra come la posizione dell'osservatore sulla Terra determina l'orientamento dell'intera sfera celeste
  2. [Archi semi-diurni e l'eclittica all'orizzonte](/codex/domification/understanding-placido/semidiurnal-arcs) spiega il meccanismo che produce tempi di levata disuguali
placidoIntroTitle: Che cos'è la domificazione Placido
precessionContent: |-
  ## Cos'è la precessione?

  La precessione degli equinozi è un lento movimento astronomico causato dal comportamento della Terra come un gigantesco giroscopio. La Terra non è una sfera perfetta: è leggermente appiattita ai poli. L'attrazione gravitazionale combinata del Sole e della Luna sul rigonfiamento equatoriale fa sì che l'asse del nostro pianeta tracci un cerchio nello spazio in circa 25.772 anni, con un moto simile a quello di una trottola.

  Questo moto ha una conseguenza importante: il polo nord celeste cambia posizione di epoca in epoca e le stelle dello sfondo scorrono lentamente rispetto ai segni zodiacali. La precessione produce una differenza misurabile tra due tipi di anno: l'**anno tropicale** (il tempo tra due equinozi di primavera successivi, 365 giorni 5 ore 48 minuti 45 secondi) e l'**anno siderale** (il tempo necessario perché il Sole torni nella stessa posizione rispetto alle stelle fisse, 365 giorni 6 ore 9 minuti 10 secondi). La differenza di circa 20 minuti si accumula nei secoli e rivela lo spostamento del punto vernale.

  [PRECESSION_DIAGRAM]

  ## La scoperta della precessione

  La prima misurazione scientifica di questa discrepanza si deve a Ipparco di Nicea (c. 190-120 a.C.), che confrontando le proprie osservazioni con quelle dei predecessori greci Timocari e Aristillo rilevò uno spostamento di 2° della stella Spica rispetto all'equinozio autunnale. La tesi che gli astronomi babilonesi avessero già formalizzato la scoperta è stata confutata [(Neugebauer, 1950)](https://www.jstor.org/stable/595428){{there is no basis visible anywhere in the cuneiform texts of the Seleucid period to support the assumption of a conscious recognition of precession}}. Il fenomeno era tuttavia osservato prima di Ipparco: come si vedrà nella testimonianza egizia, templi, dinastie e teologia riflettono il passaggio del punto vernale attraverso le costellazioni. Una revisione sistematica delle evidenze archeoastronomiche ha concluso che sebbene manchino prove definitive la quantità di indizi è notevole [(Magli, 2004)](https://arxiv.org/pdf/physics/0407108){{Although definitive evidence of the discovery is still lacking, the quantity of hints (for instance, coming from ancient Egypt) is impressive and stimulating}}.

  ## Le ere astrologiche

  Spostandosi l'asse terrestre, mutano i rapporti dell'equatore con l'eclittica e si spostano gli equinozi e i solstizi di un grado ogni 71,6 anni circa. Il punto Gamma (0° Ariete), origine delle longitudini eclittiche tanto in Astronomia come in Astrologia, attraversa nel tempo diverse costellazioni:

  - **Era dell'Ariete** (c. 2160-60 a.C.): segnata dall'ascesa delle grandi civiltà guerriere e dell'eroe individuale. Dal Nuovo Regno egizio alla Persia, dalle città-stato greche alla Repubblica romana, gli imperi si espandono attraverso la conquista. L'Ariete è un segno di fuoco governato da Marte: i temi dominanti dell'era sono l'affermazione della volontà individuale, il valore militare, la ricerca della gloria e la fondazione di nuovi ordini attraverso la forza e la legge
  - **Era dei Pesci** (dal c. 60 a.C.): contrassegnata dalla nascita e dalla diffusione del Cristianesimo, il cui simbolo più antico è il pesce. La parola greca ἰχθύς (ichthýs, "pesce") forma l'acronimo di "Gesù Cristo Figlio di Dio Salvatore"; i primi cristiani lo usavano come segno di riconoscimento durante le persecuzioni. I temi dominanti dell'era riflettono le qualità del segno: compassione, sacrificio, fede, devozione, ricerca della salvezza attraverso un'autorità spirituale esterna
  - **Era dell'Acquario**: il prossimo grande ciclo, il cui inizio è stato variamente stimato tra il ventiduesimo e il ventisettesimo secolo. L'Acquario è un segno d'aria: la tradizione astrologica gli associa il progresso scientifico e tecnologico, la ricerca della fratellanza universale e della libertà individuale, la conoscenza interiore al posto della fede cieca e la coscienza collettiva al posto dell'obbedienza all'autorità

  Le date sopra indicate sono approssimative e il concetto formale di ere legate alla precessione è più recente di quanto si creda. La prima teoria sistematica a collegare i periodi storici alla precessione degli equinozi fu formulata non nell'antichità ma durante l'Illuminismo francese, da Charles-François Dupuis e Constantin-François Volney [(Campion, 2011)](https://constable.blog/wp-content/uploads/15-1_Campion_Age_Aquarius-1.pdf){{there are no extant classical or medieval astrological texts that attribute any astrological or historical significance to precession. Instead the increasing separation between the tropical and sidereal zodiacs was used to discredit astrology}}. Non si conosce un solo esempio di questo uso della precessione da parte degli astrologi prima della fine del diciannovesimo secolo. Tra Medioevo e Rinascimento, astrologi come Guido Bonatti e Tommaso Campanella considerarono la divergenza tra zodiaco tropicale e siderale un problema per l'Astrologia, non uno strumento di previsione. L'osservazione, tuttavia, precede la formalizzazione di millenni: come mostrerà la testimonianza egizia qui sotto, templi, dinastie e teologia riflettono il passaggio del punto vernale attraverso le costellazioni.

  Lo zodiaco astrologico suddivide l'eclittica in dodici archi uguali di 30 gradi misurati dal punto vernale; le costellazioni omonime occupano invece estensioni molto diverse e i loro confini, fissati convenzionalmente dall'Unione Astronomica Internazionale nel 1930, non coincidono con queste divisioni. Non esiste un criterio univoco per stabilire il momento esatto in cui un'era finisce e la successiva comincia e le stime pubblicate coprono oltre duemila anni. Johannes Vehlow collocò la transizione nel 1793, in coincidenza con la Rivoluzione francese [(Vehlow, 1934)](http://www.astrologie-chirologie.com/johannes_vehlow_werke/johannes_vehlow_band_VIII.pdf){{So hat sich mit Hilfe der statischen, weltpolitischen Achsen endlich eindeutig feststellen lassen, wo sich gegenwärtig der Frühlingspunkt, am Sternbilderzodiakus gemessen, befindet. Die beiden anfangs erwähnten französischen Autoren hatten mit ihren Feststellungen also recht, und mit ihnen nehmen wir an, daß das Wassermannzeitalter bereits im Jahre 1793, zur Zeit der französischen Revolution begonnen hat!}}; la stima più tardiva, il 2597, si deve a Jean Meeus e poggia sui confini delle costellazioni fissati dall'UAI nel 1930 [(Meeus, 1997)](https://openlibrary.org/isbn/9780943396514){{Not until A.D. 2597 will the March equinox cross the boundary into Aquarius.}}. Come [argomentato a proposito della domificazione](/codex/domification/why-vehlow), la premessa di un calcolo è più importante del calcolo stesso: determinare l'inizio di un'era astrologica in base ai confini delle costellazioni IAU equivale a sovrapporre un criterio astronomico moderno a un sistema simbolico millenario; è lo stesso tipo di errore che la domificazione di Placido commette quando giustappone i [semi-archi diurni](/codex/domification/understanding-placido/semidiurnal-arcs) a un ordine che non è astronomico ma metafisico. Divisioni uguali di 30 gradi, più coerenti con la struttura dello zodiaco astrologico, collocano la transizione intorno al ventiduesimo secolo. Il punto vernale si trova attualmente nella costellazione dei Pesci con qualsiasi metodo di calcolo.

  L'Astrologia mondana delle Grandi Congiunzioni offre un'altra lettura dei temi acquariani attribuiti alla società contemporanea, senza richiedere un passaggio di era.

  Giove e Saturno si congiungono circa ogni vent'anni. Le loro congiunzioni formano sequenze che ricorrono prevalentemente in segni dello stesso elemento, con alcune interruzioni. Le congiunzioni del 1980–1981 avvennero in Bilancia, un segno d'Aria, mentre quella del 2000 tornò in un segno di Terra. La congiunzione del 21 dicembre 2020 in Acquario segna l'inizio di una serie prevalentemente in segni d'Aria [(Nolle, s.d.)](https://www.astropro.com/features/tables/geo/ju-sa/ju000sa.html){{It begins with the December 21, 2020 alignment and concludes with the 2199 conjunction}}. In una lettura astrologica, questo passaggio può essere associato ai temi della comunicazione e delle reti collettive, senza implicare l'inizio dell'era dell'Acquario.

  ## Dal Toro all'Ariete nell'Egitto faraonico

  Tra gli indizi che Magli definisce "impressionanti e stimolanti", il caso egizio merita un esame ravvicinato. Nell'Egitto faraonico il passaggio da un culto animale a un altro è tracciabile su fonti iconografiche, architettoniche e testuali lungo un arco di oltre duemila anni.

  ### I tre tori sacri

  L'Egitto antico venerava tre tori sacri nei suoi maggiori centri religiosi.

  A Menfi risiedeva l'**Apis**, manifestazione vivente (in egizio il *Ba*) del dio creatore Ptah. Il culto risale alla I Dinastia, ovvero intorno al 3100 a.C. [(Simpson, 1957)](https://www.jstor.org/stable/43581573){{Facing the name of the Horus 'Aha is the text: sp tpy pḥrr Ḥp, "the first occasion of the running of the Apis". The text thus provides us with an earlier mention of the running of the Apis than that given for the reign of Dn by the sealing from Saḳḳarah and the text of the Palermo Stone}}. Alla morte il toro era mummificato e sepolto nel Serapeo di Saqqara, la necropoli di Menfi scoperta da Auguste Mariette nel 1851.

  ![Il toro Apis, con le caratteristiche macchie bianche e nere e il disco solare tra le corna](codex/apis.webp)

  A Eliopoli, il **Mnevis**, araldo del dio solare Ra-Atum. Il "toro di Eliopoli" compare già nei Testi delle Piramidi della V Dinastia (c. 2350 a.C.), in piena Età del Toro [(Allen, 2005)](https://archive.org/details/the-ancient-egyptian-pyramid-texts_202103){{Unis has come against you: it is Unis, wild bull of the savannah, a bigfaced bull who comes from Heliopolis — Pyramid of Unis, Recitation 212}}.

  A Hermonthis, il **Buchis**, incarnazione del dio guerriero Montu [(Wilkinson, 2003)](https://openlibrary.org/isbn/9780500051207){{Montu could also be represented in the form of his sacred bull, the Buchis, or occasionally in the later dynasties as a bull-headed man}} e Ba vivente del dio solare Ra. Il Bucheum, la sua necropoli scoperta da Robert Mond e Oliver Myers, conserva stele che acclamano il toro con questo titolo [(Mond & Myers, 1934)](https://archive.org/details/EXCMEM41_2){{there appeared Buchis, the living Ba of Re, manifestation of Re. He was born in Hermonthis}}.

  Non a caso nella lingua egizia la parola *Ka* significa sia "toro" sia "forza vitale", il principio spirituale che accompagna ogni persona dalla nascita alla morte: per gli antichi Egizi il toro incarnava il principio vitale stesso [(Gordon & Schwabe, 2004)](https://doi.org/10.1163/9789047404163){{ka was also the name for 'bull', an equation surely not meaningless to the Egyptians}}.

  ![A sinistra: statua del Ka del faraone Hor I (ca. 1760 a.C., Museo Egizio del Cairo). A destra: rilievo templare. Il geroglifico sul capo raffigura due braccia alzate, che significano sia "toro" sia "forza vitale"](codex/ka.webp)

  ### Da Montu ad Amon

  Tra l'Antico e il Medio Regno la capitale dell'Egitto era Tebe, la cui divinità principale era proprio Montu. Gli ultimi tre sovrani dell'XI Dinastia portarono il nome Menthu-Hotep ("Montu è soddisfatto"); la XII Dinastia che seguì produsse quattro Amenemhat ("Amon è in testa") e nessun Menthu-Hotep. Nell'arco di un secolo e mezzo Amon soppiantò gradualmente Montu e raggiunse la posizione di dio supremo dell'intero pantheon egizio [(Wilkinson, 2003)](https://openlibrary.org/isbn/9780500051207){{Within a century and a half Amun gradually displaced the old god of that region, Montu, and the ascendancy of the Theban kings in Middle and New Kingdom times eventually propelled him (as the combined Amun-Re) to the position of supreme god of the Egyptian pantheon}}. Amon è un dio dalla testa di ariete. Amenemhat I spostò la capitale a Itjtawy, ma Tebe rimase il centro religioso dell'Egitto: il grande complesso templare di Karnak, originariamente dedicato a Montu, divenne il santuario di Amon-Ra. I suoi viali processionali sono fiancheggiati da sfingi a testa di ariete.

  ![Criosfingi lungo il viale processionale del tempio di Karnak. Ogni sfinge dalla testa di ariete custodisce una piccola figura del faraone tra le zampe anteriori](codex/karnak.webp)

  La cronologia di questa transizione è degna di nota [(Angelini, 1988)](https://www.kemiassociazione.it){{Verso il 2200 il punto Gamma passa da Toro ad Ariete, cade la XII Dinastia ed in Egitto vi è l'avvento di AMON, la Testa di Ariete}}. L'era del Toro termina intorno al 2160 a.C.; la caduta dell'Antico Regno si data al 2181 a.C. circa. Nell'era dell'Ariete che segue, Amon sorge fino a diventare il re degli dèi. Per oltre venti secoli la teologia egizia venerò il toro come simbolo supremo nell'era del Toro e l'ariete nell'era dell'Ariete.
