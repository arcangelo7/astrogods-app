equatorEclipticContent: |-
  ## Due cerchi, due ritmi

  Sulla sfera celeste si possono tracciare infiniti cerchi, ma due sono di gran lunga i più importanti per l'Astrologia.

  Il primo è l'**equatore celeste**: la proiezione dell'equatore terrestre sulla sfera celeste, perpendicolare all'asse di rotazione della Terra. Il secondo è l'**eclittica**: il percorso apparente che il Sole traccia tra le stelle nel corso di un anno. In realtà è la Terra a orbitare attorno al Sole, ma dalla nostra prospettiva è il Sole a spostarsi sullo sfondo stellare, a una velocità media di circa **1 grado al giorno** (360 gradi diviso 365,25 giorni). L'eclittica è il cerchio più importante dell'Astrologia: lo zodiaco è definito lungo di essa, le posizioni planetarie sono misurate lungo di essa, le case sono divisioni di essa.

  ## L'obliquità dell'eclittica

  L'eclittica non coincide con l'equatore celeste. È **inclinata di 23,44 gradi** rispetto ad esso. Questa inclinazione si chiama **obliquità dell'eclittica** ed è dovuta al fatto che l'asse di rotazione terrestre non è perpendicolare al piano orbitale, ma è inclinato di 23,44 gradi.

  Se l'asse terrestre fosse perfettamente verticale rispetto all'orbita, eclittica ed equatore coinciderebbero. Non ci sarebbero stagioni, il giorno durerebbe sempre 12 ore ovunque e l'Astrologia perderebbe buona parte della sua struttura.

  [EQUATOR_ECLIPTIC_DIAGRAM]

  Lo slider muove il Sole lungo l'eclittica nel corso di un anno.

  Agli equinozi il Sole si trova esattamente sull'equatore celeste: giorno e notte hanno la stessa durata. Ai solstizi il Sole raggiunge la massima distanza dall'equatore, producendo i giorni più lunghi e più corti dell'anno.

  ## I punti di intersezione: equinozi e solstizi

  I due cerchi si intersecano in due punti. Quando il Sole si trova in uno di questi punti, si trova contemporaneamente sull'eclittica e sull'equatore celeste. Il Sole si trova esattamente sull'equatore celeste. Questi momenti sono gli **equinozi**:

  - **Equinozio di primavera** (punto vernale, 0 gradi Ariete): il Sole attraversa l'equatore dal basso verso l'alto, passando dall'emisfero celeste sud a quello nord. Questo punto è l'origine dello zodiaco tropicale
  - **Equinozio d'autunno** (0 gradi Bilancia): il Sole attraversa l'equatore dall'alto verso il basso

  A metà strada tra gli equinozi, il Sole raggiunge la massima distanza dall'equatore. Questi punti sono i **solstizi**:

  - **Solstizio d'estate** (0 gradi Cancro): il Sole raggiunge il punto più a nord, a 23,44 gradi sopra l'equatore celeste. Il giorno più lungo nell'emisfero nord
  - **Solstizio d'inverno** (0 gradi Capricorno): il Sole raggiunge il punto più a sud, a 23,44 gradi sotto l'equatore celeste. Il giorno più corto nell'emisfero nord

  ## Le stagioni

  L'obliquità dell'eclittica è la causa diretta delle stagioni. Quando il Sole si trova sulla parte dell'eclittica al di sopra dell'equatore celeste (da marzo a settembre), l'emisfero nord riceve più luce: i giorni sono più lunghi delle notti, il Sole sale più alto nel cielo. Quando si trova sulla parte al di sotto (da settembre a marzo), accade l'opposto.

  La differenza tra le stagioni non dipende dalla distanza dal Sole (che varia poco), ma dall'angolo con cui i raggi solari colpiscono il suolo e dalla durata dell'illuminazione.

  ## Lo zodiaco

  Lo **zodiaco** è una fascia larga circa 8-9 gradi su ciascun lato dell'eclittica. Tutti i pianeti del sistema solare si muovono all'interno di questa fascia (con rare eccezioni per Plutone). Lo zodiaco tropicale, quello usato nell'Astrologia occidentale, divide l'eclittica in **12 segmenti uguali di 30 gradi**, ciascuno associato a un segno zodiacale.

  Il punto di partenza è l'equinozio di primavera (0 gradi Ariete). Da lì si contano 30 gradi per l'Ariete, poi 30 per il Toro, e così via fino ai Pesci. Questa divisione è puramente geometrica: non corrisponde alle costellazioni omonime, che hanno dimensioni diverse e si sono spostate a causa della [precessione degli equinozi](/codex/astronomy-fundamentals/precession).
