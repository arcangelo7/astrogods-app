bookOfCaverns: Il Libro delle Caverne
bookOfCavernsIntroduction: |-
  ## I Testi Funerari Egizi e l'Astrologia

  Questa trattazione delle **12 case astrologiche** è basata su testi funerari egizi del Nuovo Regno che descrivono il viaggio del dio sole Ra attraverso l'oltretomba, seguendo l'interpretazione astrologica di Angelo Angelini.

  ## I due testi fonte

  Le dodici caverne qui presentate derivano da due testi egizi distinti:

  ### Caverne 1-6: Il Libro delle Caverne propriamente detto
  Testo funerario ramesside che descrive il viaggio notturno di Ra attraverso sei sezioni della Duat. Caratterizzato da scene di punizione dei nemici di Ra e Osiride, questo testo è attestato nelle sue versioni più complete nella tomba di Ramses VI (KV9) e nell'Osireion di Seti I ad Abydos.

  L'egittologia contemporanea sostiene che il Libro delle Caverne contenga in realtà tutte e dodici le caverne, organizzate con più caverne per sezione ([Power, 2015](https://doi.org/10.17638/03032971)). Per questa trattazione astrologica seguiamo tuttavia l'interpretazione di Angelini che assimila ognuna delle sei sezioni a una casa astrologica.

  ### Caverne 8-12: Il Libro delle Dodici Caverne
  Conosciuto anche come **Incantesimo delle Caverne**, questo testo fu a lungo considerato parte del Libro dei Morti. Alexandre Piankoff ha dimostrato che si tratta invece di una composizione indipendente con carattere liturgico benevolo: le divinità concedono favori al defunto senza scene di punizione.

  Le prime sette caverne del Libro delle Dodici Caverne sono rappresentate in maniera estremamente sintetica e schematica, dando ben poche informazioni sul loro contenuto, mentre sono soltanto le ultime cinque (dalla 8 alla 12) a essere descritte in maniera dettagliata.

  Angelo Angelini interpreta l'ottava caverna del Libro delle Dodici Caverne come l'ottava casa astrologica - un collegamento simbolico, non filologico.

  ## Il significato di "Caverna"

  In egizio **Kerreret** o **Kerret**:

  ![Geroglifico di Kerreret](caverna.webp)

  Secondo Angelo Angelini, il geroglifico combina:
  - **Q** (triangolo): la materia da lavorare
  - **Semi**: il tempo
  - **Rettangolo aperto**: lo spazio

  Il termine indica quindi "uno spazio temporale" - essenza della domificazione astrologica, dove il tempo celeste (transiti planetari) si cristallizza in esperienza terrena.

  ## Fonti

  ### Libro delle Caverne (caverne 1-6)
  - **Ricostruzione filologica**: Werning, D. A. (2019). The Book of Caverns in Theban Tomb 33: Late Period reception process and individual adaptation. *Bulletin de l'Institut français d'archéologie orientale*, *118*, 525-554. [https://doi.org/10.4000/bifao.5059](https://doi.org/10.4000/bifao.5059)
  - **Interpretazione iconografica**: Power, D. M. (2019). *Aspects of iconography and transmission in the Book of Caverns* [Tesi di dottorato]. University of Liverpool. [https://doi.org/10.17638/03032971](https://doi.org/10.17638/03032971)
  - **Fonte iconografica**: [Theban Mapping Project](https://thebanmappingproject.com/tombs/kv-09-rameses-v-and-rameses-vi), tomba di Ramses VI

  ### Libro delle Dodici Caverne (caverne 8-12)
  - **Ricostruzione filologica**: Méndez Rodríguez, D. M. (2015). The transmission of the Book of the Twelve Caverns. In G. Rosati & M. C. Guidotti (Eds.), *Proceedings of the XI International Congress of Egyptologists* (pp. 405-409). Archaeopress. [https://doi.org/10.2307/j.ctv177tjnf.77](https://doi.org/10.2307/j.ctv177tjnf.77)
  - **Interpretazione iconografica**: Piankoff, A. (1974). *The wandering of the soul*. Princeton University Press. [https://archive.org/details/wanderingofsoul0006pian](https://archive.org/details/wanderingofsoul0006pian)
  - **Fonte iconografica**: [Papiro EA 10478](https://www.britishmuseum.org/collection/object/Y_EA10478-6), British Museum

  ### Interpretazione astrologica
  - Angelini, A. (1992). *Manuale di astrologia egizia*. Kemi.

  **Nota**: I colori nelle illustrazioni delle caverne 1-6 sono suggestivi e hanno funzione comunicativa per evocare l'atmosfera dell'oltretomba, non filologica, in quanto gli originali su parete sono molto deteriorati. Per le caverne 8-12 sono stati utilizzati i colori originali del Papiro EA 10478 del British Museum.
celestialSphereContent: |-
  ## L'osservazione del cielo notturno

  Se in una notte limpida, lontano dalle luci artificiali, ci si ferma a guardare il cielo per qualche ora, si nota un fatto immediato: le stelle non cambiano posizione le une rispetto alle altre. Le costellazioni mantengono la loro forma. Eppure l'intero cielo si muove, lentamente, da est verso ovest. Una stella che all'inizio della sera si trovava bassa sull'orizzonte orientale, qualche ora dopo sarà salita più in alto; una che era allo zenit sarà scesa verso occidente.

  Questo movimento apparente è causato dalla rotazione della Terra attorno al proprio asse. Noi non percepiamo la rotazione terrestre, quindi vediamo le stelle muoversi.

  ## La sfera celeste come modello

  Per descrivere le posizioni degli astri, gli astronomi utilizzano un modello geometrico: la **sfera celeste**. Si tratta di una sfera immaginaria di raggio infinito, centrata sull'osservatore. Tutte le stelle, i pianeti e gli altri corpi celesti vengono proiettati sulla superficie interna di questa sfera.

  Non importa che le stelle si trovino a distanze enormemente diverse tra loro. Sulla sfera celeste contano solo le direzioni, non le distanze. Due stelle che appaiono vicine in cielo sono vicine sulla sfera celeste, anche se una potrebbe essere cento volte più lontana dell'altra.

  ## I punti di riferimento

  L'**orizzonte** è il cerchio che separa la metà di sfera celeste visibile (sopra di noi) da quella invisibile (sotto di noi). Sull'orizzonte si individuano quattro punti cardinali: **Nord**, **Sud**, **Est** e **Ovest**. Il punto direttamente sopra la testa dell'osservatore si chiama **zenit**; il punto diametralmente opposto, sotto i piedi, si chiama **nadir**.

  Il **meridiano** è l'arco immaginario che parte dall'orizzonte nord, sale fino allo zenit e scende fino all'orizzonte sud. Divide il cielo in due metà: orientale e occidentale.

  Nel tema natale, questi punti di riferimento definiscono i quattro angoli. Il grado dello zodiaco che sorge a Est è l'**Ascendente**; quello che tramonta a Ovest è il **Discendente**. Il grado dello zodiaco al punto più alto del meridiano è il **Medio Cielo** (MC); quello opposto, sotto l'orizzonte, è il **Fondo Cielo** (IC, dal latino *Imum Coeli*).

  [CELESTIAL_SPHERE_DIAGRAM]
