diagramCaptionCelestialSphere: La sfera celeste vista da un osservatore a latitudine media. Lo slider ruota la sfera per mostrare il moto apparente del cielo
diagramCaptionEquatorEcliptic: Equatore celeste ed eclittica. Lo slider muove il Sole lungo l'eclittica nel corso di un anno
diagramCaptionLatitudeSky: La sfera celeste a diverse latitudini. Lo slider varia la latitudine e mostra come cambia l'altezza del polo celeste e l'inclinazione dei cerchi stellari rispetto all'orizzonte
diagramCaptionEclipticRising: Confronto tra ascensione lunga e ascensione corta. Il numero di gradi zodiacali che sorgono nello stesso intervallo di tempo cambia a seconda dell'angolo tra eclittica e orizzonte
diagramCaptionEclipticHorizon: L'eclittica all'orizzonte orientale. Lo slider dell'ora mostra come varia l'angolo di incidenza durante la rotazione diurna
diagramCaptionSemidiurnalArc: Sfera celeste con eclittica e orizzonte. Lo slider della latitudine modifica l'inclinazione della sfera; lo slider dell'ora mostra la rotazione diurna
diagramCaptionPlacido: Case di Placido viste dall'alto. Lo slider varia la latitudine per mostrare come la distorsione cresce allontanandosi dall'equatore
diagramCaptionPrecession: L'asse terrestre traccia un cono nello spazio in circa 25.772 anni. Lo slider ruota l'asse per mostrare l'oscillazione
diagramCaptionWholeSign: Case a segno intero. Ogni segno zodiacale costituisce una casa completa. Lo slider sposta l'Ascendente per mostrare come cambia la distribuzione
domificationArticleContent: |-
  ## Introduzione

  Perché AstroGods utilizza la domificazione Vehlow e non quella di Placido? La domanda è legittima: la stragrande maggioranza dei software astrologici adotta il sistema di Placido de Titis, un monaco olivetano del XVII secolo il cui metodo è diventato, per inerzia storica più che per merito filosofico, lo standard moderno. Eppure, se si risale alle origini dell'Astrologia, si scopre che le case uguali rappresentano il sistema più antico, più diffuso e più coerente con la visione del mondo su cui l'Astrologia stessa si fonda. Nei paragrafi che seguono ricostruiremo le ragioni di questa scelta, partendo da una domanda ancora più profonda: cosa sono, davvero, le Case?

  ## Cosa sono le Case: una premessa necessaria

  Prima di scegliere un sistema di domificazione, occorre capire cosa siano le Case.

  Nell'Astrologia moderna le Case vengono spesso trattate come semplici divisioni geometriche dello spazio celeste, settori da calcolare con formule trigonometriche. Ma nella tradizione antica la concezione è radicalmente diversa. Le Case sono le dodici porzioni dell'aura eterica umana: quella parte del corpo sottile microcosmico che consente alla matrice celeste macrocosmica (i Segni) di cristallizzarsi nella matrice terrestre microcosmica (il corpo fisico ed eterico).

  Il termine egizio per indicare le Case è *Kereret* (o *Kerret*), che viene tradotto come "Caverna" nel cosiddetto [Libro delle Caverne](/codex/domification/book-of-caves). Ma questa traduzione è riduttiva. Come osserva Angelini, analizzando l'etimologia geroglifica, *Kereret* contiene in sé sia il concetto di spazio sia quello di tempo: è uno *spazio-tempo*, un'unità inscindibile di luogo e durata [(Angelini, 1992)](https://www.kemiassociazione.it/product/?manuale-di-astrologia-egizia){{la caverna è uno spazio temporale, un luogo che è collegato al tempo. Con questa definizione gli Egizi hanno magistralmente indicato cosa sia, in sostanza, la domificazione: uno spazio che è in funzione del tempo, oppure un tempo che non si può dissociare dallo spazio}}.

  Questa concezione rende immediatamente evidente il limite delle domificazioni moderne: Campano considera le Case un fenomeno puramente spaziale, Placido le tratta come fenomeno temporale. Nessuna delle due coglie la natura unitaria del *Kereret*.

  ## La premessa determina la conclusione

  In un corso di Astrologia del 1991, Angelo Angelini formula un principio che illumina l'intera questione della domificazione: un calcolo risolve sempre la premessa che gli è stata posta a monte, ma se quella premessa è sbagliata, il risultato sarà inevitabilmente sbagliato, indipendentemente dal rigore matematico impiegato [(Angelini, 1991)](https://www.kemiassociazione.it/astrologia-iv---angelini.html){{La premessa di un calcolo è fondamentale. Il calcolo ti risolve la premessa che tu hai posto a monte, ma se questa premessa è sbagliata, ti porta ad una conclusione sbagliata.}}.

  La domificazione di Placido parte da una premessa astronomico-matematica: divide il [semi-arco diurno](/codex/domification/understanding-placido/semidiurnal-arcs) di ciascun grado zodiacale in parti uguali di tempo e ricava le cuspidi delle case dai gradi che corrispondono a ciascuna divisione. Il calcolo è trigonometricamente ineccepibile, ma la conversione dal tempo ai gradi dello zodiaco produce case di ampiezza disuguale, perché l'[eclittica](/codex/astronomy-fundamentals/equator-ecliptic) incontra l'orizzonte con angoli diversi nel corso della rotazione celeste. La distorsione cresce con la [latitudine](/codex/domification/understanding-placido/latitude-sky) dell'osservatore: all'equatore le case restano quasi regolari, alle alte latitudini alcune si gonfiano e altre si restringono fino a diventare sottilissime. Per una trattazione approfondita con diagrammi interattivi si veda la sezione [Comprendere la domificazione Placido](/codex/domification/understanding-placido).

  [PLACIDO_DIAGRAM]

  Il calcolo è corretto, ma la premessa lo è? La domificazione Vehlow parte da un fondamento del tutto diverso: metafisico e analogico. Le Case rappresentano i dodici campi archetipici dell'esperienza, le dodici sezioni dell'aura umana. La loro struttura deve rispecchiare l'ordine cosmico, non la contingenza astronomica di un dato luogo e momento. Per quanto un calcolo possa imporsi come matematicamente perfetto, ciò che conta è la concezione del mondo sulla cui base quel calcolo è stato costruito.

  ## Breve storia della domificazione

  Le case uguali non sono un'innovazione recente: sono il sistema dominante dell'Astrologia per la maggior parte della sua storia documentata.

  Il metodo prevalente era quello delle case a segno intero (*Whole Sign Houses*), in cui ogni segno zodiacale corrisponde a una casa completa: lo attestano le fonti dell'Astrologia ellenistica (III sec. a.C. - I sec. d.C.), dell'età imperiale romana (Vettius Valens, II sec. d.C.; Firmico Materno, IV sec. d.C.) e della tradizione araba altomedievale, fino al IX-X sec. [(Hand, 2007)](https://www.cultureandcosmos.org/pdfs/11/11_Hand_Signs_as_Houses_Vol11.pdf){{The practice of using signs as places did not die out at the end of the Greek era. We also find it in early Arabic era authors such as Masha'allah (fl. 762-815)}}. Nell'Astrologia vedica indiana il medesimo principio (*Rashi Chakra*) è rimasto in uso ininterrotto fino a oggi.

  [WHOLE_SIGN_HOUSES_DIAGRAM]

  A differenza delle case a segno intero, dove ogni segno costituisce una casa di 30° esatti, le domificazioni a quadranti prendono come riferimento i [quattro angoli](/codex/astronomy-fundamentals/celestial-sphere) (Ascendente, Discendente, Medio Cielo e Fondo Cielo). Questi quattro punti dividono l'eclittica in quattro settori, i quadranti, che vengono poi suddivisi per ricavare le case intermedie. Poiché i quattro settori non sono mai esattamente uguali, le case risultanti hanno ampiezza variabile.


  Il primo sistema a quadranti a diffondersi fu quello di Alcabizio (al-Qabisi, X sec.), che divenne il metodo standard nell'Astrologia araba e latina medievale. Seguirono Campano (XIII sec.), Regiomontano (XV sec.) e infine Placido.

  Il contesto in cui Placido elaborò il suo sistema è quello della rivoluzione scientifica del XVII secolo. Il paradigma meccanicistico di Galileo, Newton e Descartes stava ridefinendo i criteri di legittimità del sapere: contava ciò che era misurabile, calcolabile, riproducibile. L'Astrologia perse il suo statuto di scienza analogica e unitaria e venne relegata ai margini. In quel clima è naturale che le nuove domificazioni si fondassero sul solo calcolo astronomico, abbandonando le premesse metafisiche che avevano sorretto per millenni il sistema delle case uguali.

  Nel XX secolo, l'astrologo tedesco Johannes Vehlow riprese il sistema delle case uguali e lo perfezionò ponendo l'Ascendente al centro della I casa, con la casa che si estende 15 gradi prima e 15 gradi dopo. Chiamò il suo approccio "antike Manier" (metodo antico) perché lo ritrovava nelle fonti classiche [(Vehlow, 1933)](http://www.astrologie-chirologie.com/johannes_vehlow_werke/johannes_vehlow_band_I.pdf){{Die Bezeichnung "antike Manier" habe ich deshalb gewählt, weil die Einteilung der Häuser mit den Kardinalpunkten in den Mitten einer uralten Methode entspricht unter Zugrundelegung der antiken Urtypen, dem Thema mundi}}.

  L'invenzione delle case disuguali, scrive Vehlow, generò un "Rattenkönig" (groviglio) di ulteriori metodi di calcolo. L'antico sistema non fu abbandonato perché non funzionava, ma perché il razionalismo riformò l'oroscopo fino a privarlo del suo carattere simbolico, riducendolo a un arido esercizio di calcolo.

  ## Perché le case uguali

  ### Convergenze tra tradizioni

  Il sistema a case uguali non è un'invenzione isolata. Tradizioni diverse convergono sulla stessa struttura duodenaria proporzionale.

  #### Astrologia vedica (Jyotish)

  L'Astrologia oroscopica a dodici case entra in India attraverso il contatto con la tradizione ellenistica, documentato almeno dallo *Yavanajataka*, versificazione sanscrita del 269/270 d.C. di un trattato greco [(Pingree, 1978)](https://archive.org/details/PingreeYJ){{From the concluding three verses of the Yavanajataka we know the author's name and that the date of his composition was A.D. 269/270. We are further informed that it is a versified version of a prose translation, made by one Yavanesvara, "the lord of the Greeks," in the year A.D. 149/150}}. Il titolo è di per sé eloquente: *Yavanajataka* significa letteralmente "oroscopia dei Greci", poiché *Yavana* era il termine sanscrito per designare i Greci, derivato dal greco antico *Ἴωνες* (Ioni).

  Il sistema a dodici case del Jyotish non è dunque un'invenzione autonoma. La domanda rilevante non è se gli indiani abbiano trovato le Whole Sign Houses indipendentemente, ma perché, una volta ricevuto il sistema ellenistico, l'India lo abbia conservato mentre l'Occidente lo sostituiva progressivamente con metodi dipendenti dalla latitudine. Nel Jyotish il *Rashi Chakra* (la ruota dei segni) funge direttamente da mappa delle *bhāva* (case): ogni *rashi* coincide con un campo di esperienza.

  La risposta risiede in una compatibilità filosofica profonda. La tradizione vedica possedeva già il concetto di *Ṛta*: l'ordine cosmico primordiale, dalla radice indoeuropea *\*h₂ar-*. È la stessa radice che dà il greco *ἁρμονία* (armonia) e il latino *ars* (arte, tecnica): tre parole che in lingue diverse nominano la stessa cosa, il proporzionato congiungimento delle parti. Un sistema di dodici settori uguali, nessuno deformato dalla latitudine, risuonava naturalmente con un orizzonte concettuale in cui l'ordine cosmico è simmetrico e universale per definizione.

  #### I Dodici Rami Terrestri cinesi

  Nella cosmologia cinese, i Dodici Rami Terrestri (*Dizhi*) articolano il tempo e lo spazio su tre livelli contemporaneamente: le dodici "doppie ore" di due ore ciascuna che compongono il giorno, i dodici mesi lunari che compongono l'anno e dodici direzioni bussola a intervalli di 30° l'una dall'altra. In ognuno dei tre registri la scansione è equidistante: dodici principi uguali in dignità, nessuno gonfiato o compresso dalla posizione geografica.

  Il livello delle doppie ore è quello più direttamente confrontabile con le case astrologiche. Le case, nell'Astrologia occidentale, dividono il ciclo diurno in dodici settori di esperienza. I Rami Terrestri dividono le stesse ventiquattro ore in dodici periodi identici di due ore, indipendentemente dalla latitudine. Nessuna dottrina cinese sostiene che l'ora del Drago debba durare più dell'ora del Coniglio perché il natale è a Oslo invece che a Mumbai.

  Questa struttura trova la sua espressione astrologica più elaborata nel *Zi Wei Dou Shu* (紫微斗數), l'Astrologia della Stella Polare Viola. In questo sistema il tema natale è organizzato in dodici palazzi uguali, uno per ciascun Ramo Terrestre: Vita, Fratelli, Coniuge, Figli, Ricchezza, Salute, Viaggi, Amici, Carriera, Proprietà, Mente, Genitori. I palazzi sono settori di esperienza analoghi alle case occidentali e la loro uguaglianza è strutturale: non dipende da dove l'osservatore si trova sulla Terra.

  #### La Cabala e il Sefer Yetzirah

  Il *Sefer Yetzirah* (Libro della Formazione, III–VI sec. d.C.) assegna le ventidue lettere dell'alfabeto ebraico alla geometria di un cubo: tre alle tre dimensioni dello spazio (altezza, larghezza, profondità), sette alle sei direzioni cardinali (su, giù, nord, sud, est, ovest) e al punto centrale, dodici agli spigoli in cui due facce adiacenti si incontrano. La tradizione commentaristica cabalistica ha chiamato questo modello il Cubo dello Spazio. Il §47 del testo, il paragrafo che elenca le dodici direzioni diagonali, chiama queste posizioni *גבולי אלכסון*, «confini diagonali», e le associa alle dodici costellazioni zodiacali, ai dodici mesi e a dodici organi del corpo [(Hayman, 2004)](https://doi.org/10.1628/978-3-16-158795-5){{Twelve simple letters: He, Waw, Zayin, Ḥet, Tet, Yod, Lamed, Nun, Samek, Ayin, Sade, Qof. He carved them, he combined them, he hewed them, he weighed them and exchanged them, and formed with them the constellations, the months, and the principal (bodily) organs}}. Tutti i dodici spigoli di un cubo sono geometricamente identici: la simmetria del solido non consente gerarchie tra loro.

  #### Il Pitagorismo e il dodecagono regolare

  Nella tradizione pitagorica i numeri sono principi formali attraverso cui l'ordine del cosmo si rende intelligibile [(Aristotele, *Metafisica*, c. 350 a.C.)](https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0052%3Abook%3D1%3Asection%3D985b){{all other things have their whole nature modelled upon numbers, and that numbers are the ultimate things in the whole physical universe}}. Al centro di questa tradizione si trova la Tetractys, la figura triangolare generata dalla somma dei quattro primi interi (1 + 2 + 3 + 4 = 10), che i Pitagorici veneravano come il fondamento dell'armonia cosmica.

  Su una corda vibrante, dimezzare la lunghezza produce il suono all'ottava superiore, ridurla a due terzi produce la quinta, ridurla a tre quarti produce la quarta. I rapporti 2:1, 3:2 e 4:3 usano soltanto i numeri 1, 2, 3 e 4 della Tetractys [(Teone di Smirne, *Expositio rerum mathematicarum*, c. 115–140 d.C.)](https://archive.org/details/theonissmyrnaei00theogoog){{τοὺς δὲ συμφωνοῦντας φθόγγους ἐν λόγοις τοῖς πρὸς ἀλλήλους πρῶτος ἀνευρηκέναι δοκεῖ Πυθαγόρας, τοὺς μὲν διὰ τεσσάρων ἐν ἐπιτρίτῳ, τοὺς δὲ διὰ πέντε ἐν ἡμιολίῳ, τοὺς δὲ διὰ πασῶν ἐν διπλασίῳ}}. Il minimo comune multiplo di 1, 2, 3 e 4 è 12: il più piccolo intero divisibile per ciascuno di essi. Un cerchio suddiviso in dodici settori di 30 gradi traduce questa struttura nel piano.

  Platone, nel *Timeo*, chiude il sistema dei solidi regolari assegnando il dodecaedro, il solido a dodici facce pentagonali, alla struttura dell'intero cosmo: "il dio lo usò per il tutto" [(Platone, *Timeo*, c. 360 a.C.)](https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0180%3Atext%3DTim.%3Asection%3D55c){{And seeing that there still remained one other compound figure, the fifth, God used it up for the Universe in his decoration thereof}}; il motivo è che il dodecaedro è il solido platonico che più si avvicina alla sfera e il cosmo platonico è sferico [(Zeyl & Sattler, 2022)](https://plato.stanford.edu/entries/plato-timaeus/){{The remaining regular solid, the dodecahedron, is "used for the universe as a whole," since it approaches most nearly the shape of a sphere}}. Il dodecagono regolare è la proiezione piana di questa struttura cosmologica: dodici settori uguali, nessuno più ampio o più ristretto degli altri.

  ### Il fondamento metafisico: l'aura e la simmetria

  Queste convergenze trovano una spiegazione nella seguente premessa metafisica: le case non sono settori di spazio celeste definiti da formule trigonometriche, ma le dodici sezioni dell'aura eterica dell'essere umano, quella raffigurata nel [Libro delle Caverne](/codex/domification/book-of-caves/cavern/1) come un ovale, un involucro magnetico attorno alla figura umana.

  Se le case sono le sezioni dell'aura, la questione della loro ampiezza ha una risposta necessaria: devono essere uguali. L'ampiezza non può dipendere dalla latitudine dell'osservatore perché l'aura è una proprietà intrinseca dell'essere, non dell'orizzonte astronomico. Una I casa di 40 gradi a Oslo e di 28 a Roma significherebbe che la sezione dell'aura legata all'identità cambia dimensione con la latitudine. Nella stessa carta, una I casa più ampia della II significherebbe che l'aura dedica più spazio all'identità che alle risorse. Al polo alcune case scompaiono e quella persona non avrebbe i campi di esperienza corrispondenti.

  La stessa struttura si ritrova su scala cosmica. Lo Zodiaco è l'aura del Sole: non il percorso apparente del Sole nel cielo, ma il suo campo energetico, suddiviso in dodici segni uguali di 30 gradi. Nessuno si sognerebbe di dividere lo Zodiaco in parti disuguali perché le costellazioni omonime hanno estensioni diverse. Dal punto di vista strettamente astronomico le costellazioni attraversate dall'eclittica non sono nemmeno dodici: l'Ofiuco si interpone tra Scorpione e Sagittario e il Sole vi transita più a lungo di quanto transiti nello Scorpione stesso. Eppure nessun sistema astrologico lo include tra i segni, perché lo Zodiaco non è un catalogo astronomico di ammassi stellari: è una struttura metafisica e simbolica.

  ## Perché l'Ascendente è al quindicesimo grado

  ### Il Thema Mundi

  Nel IV secolo Firmico Materno descrive il *Thema Mundi*, la carta astrologica mitica della creazione, attribuendone la dottrina alla tradizione egizia: il segreto sarebbe passato da Esculapio e Anubis a Petosiris e Nechepso per tramite di Mercurio. Nella carta ogni pianeta siede al quindicesimo grado del proprio domicilio: il Sole al 15° del Leone, la Luna al 15° del Cancro, Saturno al 15° del Capricorno, Giove al 15° del Sagittario, Marte al 15° dello Scorpione, Venere al 15° della Bilancia, Mercurio al 15° della Vergine. L'Ascendente è posto al quindicesimo grado del Cancro [(Firmico Materno, *Matheseos Libri VIII*, c. 334 d.C.)](https://www.astrologiahumana.com/firmicusmaternustheoryandpractice.pdf){{the Sun in the 15th degree of Leo, the Moon in the 15th degree of Cancer, Saturn in the 15th degree of Capricorn, Jupiter in the 15th degree of Sagittarius, Mars in the 15th degree of Scorpio, Venus in the 15th degree of Libra, Mercury in the 15th degree of Virgo, and the ascendant in the 15th degree of Cancer}}. Il quindicesimo grado è il centro esatto del segno.

  Lo stesso Firmico chiarisce che il *Thema Mundi* non racconta un evento storico: è un modello normativo, costruito dai sapienti antichi affinché l'astrologo lo adotti nella redazione delle carte individuali. La domanda è: cosa insegna, concretamente, un modello in cui ogni elemento è centrato nel proprio segno?

  Non può insegnare a collocare i pianeti al quindicesimo grado: le posizioni planetarie sono dati astronomici determinati dall'istante di nascita; l'astrologo li calcola, non li sceglie. Ciò che il modello trasmette è un principio strutturale: il centro del segno è il luogo di massima potenza. Non a caso ogni pianeta è collocato nel segno che governa, la dignità essenziale più forte; porlo al quindicesimo grado significa portarlo al culmine della propria forza.

  L'Ascendente è l'unico elemento per il quale questo principio può essere applicato operativamente. La sua posizione nello zodiaco è calcolata come quella dei pianeti, ma il modo in cui le case si organizzano attorno ad esso è una scelta di metodo. Il *Thema Mundi* insegna che il punto organizzatore della carta va posto al centro della casa, non al suo bordo. Vehlow fondò il suo sistema su questa evidenza, riconoscendovi il metodo originario dell'Astrologia antica [(Vehlow, 1933)](http://www.astrologie-chirologie.com/johannes_vehlow_werke/johannes_vehlow_band_I.pdf){{Der Aszendent, der die Stunde — hora oder Horoscopus bedeutet, wurde in die Mitte des Zeichens Krebs verlegt. Von Häuserspitzen ist hier nirgends die Rede!}}. L'origine egizia della dottrina è il motivo per cui il sistema Vehlow è noto anche come domificazione egizia.

  ### Il centro come punto di massima potenza

  La tradizione del Jyotish ha formalizzato lo stesso principio con un nome preciso: *bhava madhya*, il "centro della casa". Il grado del *lagna* (Ascendente) non segna il bordo della I casa ma ne occupa il centro: la casa si estende 15 gradi prima e 15 gradi dopo il grado ascendente. I confini tra una casa e la successiva si chiamano *bhava sandhi*, le giunzioni di casa.

  La distinzione tra madhya e sandhi ha un fondamento non soltanto topologico ma funzionale. Il *Phaladeepika* di Mantreswara, uno dei testi classici del Jyotish, stabilisce un principio netto: anche un pianeta in esaltazione o in segno amico perde tutta la sua efficacia se si trova al *bhava sandhi*; al contrario, i pianeti che occupano il grado esatto del *bhava madhya* producono l'effetto pieno della casa, mentre quelli in posizioni intermedie producono effetti parziali [(Mantreswara, *Phaladeepika*, XIII sec.)](https://www.panchanga.lv/wp-content/uploads/2020/06/Phaladipika_Shri-Mantreswara.pdf){{Even if a planet be posited in his sign of exaltation or a friendly sign, he proves in affliction if he is situated in Bhava-Sandhi. The planets occupying the exact degrees (Bhava-Madhya) produce the full effects of that house. The planets situated in Bhava-Sandhi produce no effects}}.

  Questo gradiente di forza trasforma la posizione dell'Ascendente da scelta geometrica a questione funzionale. Se il centro della casa ne è il punto di massima efficacia, l'Ascendente, il punto più determinante dell'intera carta, deve coincidere con il *bhava madhya* della I casa. Porlo al bordo significherebbe collocare il principio organizzatore della carta nel suo punto di minore potenza: una contraddizione strutturale.

  ## Perché Placido non funziona

  ### Impossibilità oltre il 60esimo parallelo

  La domificazione Placido non funziona oltre circa 66 gradi di latitudine. Come denunciò già nel 1897 Fomalhaut nel suo *Manuel d'astrologie sphérique et judiciaire* [(Nicoullaud, 1897)](https://archive.org/details/BSG_DELTA61179FA){{Or il est inadmissible d'adopter un système qui ne s'applique pas à tous les lieux du Globe}}: "È inammissibile adottare un sistema che non si applica a tutti i luoghi del Globo." Questa limitazione da sola dovrebbe bastare a mettere in discussione un sistema che pretende di descrivere un ordine universale. Gli abitanti dell'Alaska, della Scandinavia settentrionale, della Russia artica sarebbero esclusi dal rapporto tra cosmo e individuo per un difetto del metodo di calcolo.

  ### Distorsione degli aspetti planetari

  In Placido, la sproporzione nell'estensione delle case produce aberrazioni negli aspetti tra le case stesse. Si verificano casi in cui una I casa si trova in trigono con la IV, o la X in sestile con la VII: case che dovrebbero essere in quadratura, poiché vertici degli assi zodiacali, finiscono in rapporti armonici, uno scenario contraddittorio rispetto all'intera struttura dell'oroscopo.

  ### I segni intercettati: un artefatto del calcolo

  Nei sistemi a quadrante come Placido, le case possono superare i 30° di ampiezza. Quando una casa è così grande da contenere un intero segno zodiacale senza che esso compaia su alcuna cuspide, si dice che il segno è *intercettato*: è inglobato dalla casa, privo di una propria cuspide. Il fenomeno si verifica sempre in coppie opposte. Alcuni astrologi interpretano i segni intercettati come energie nascoste o bloccate, più difficili da esprimere.

  La teoria è relativamente recente. Non esistono riferimenti significativi alle intercettazioni negli autori classici (Vettio Valente, Tolomeo, Manilio) né medievali (Al-Biruni, Masha'allah, Guido Bonatti), che utilizzavano prevalentemente case a segno intero, nelle quali le intercettazioni sono strutturalmente impossibili. Il primo trattamento monografico si trova nell'opera di Joanne Wickenburg, che nel 1978 pubblicò *Intercepted Signs: Environment vs. Destiny* [(Wickenburg, 1978)](https://www.goodreads.com/book/show/18669388-intercepted-signs).

  Dal punto di vista critico, le intercettazioni sono artefatti del metodo di calcolo, non fenomeni cosmici reali. Il caso più eloquente è quello dell'equatore: a latitudine zero le case di Placido misurano tutte circa 30° e le intercettazioni di fatto non si verificano. Chi nasce a Quito, Nairobi o Jakarta non ha segni intercettati nel proprio tema natale. Salendo di latitudine le case iniziano a deformarsi; oltre i 40° le intercettazioni diventano sistematiche; alle latitudini polari alcune case si estendono per oltre 60°. La teoria implica che intere popolazioni equatoriali siano prive delle "energie nascoste" che essa attribuisce a chi nasce a latitudini medio-alte, mentre due gemelli nati nello stesso istante a Quito e a Stoccolma avrebbero carte strutturalmente diverse sotto lo stesso cielo, con gli stessi pianeti nelle stesse posizioni. Ha senso attribuire dinamiche psicologiche profonde a un artefatto che dipende esclusivamente dalla latitudine di nascita?
