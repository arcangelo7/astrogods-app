latitudeSkyContent: |-
  Questo articolo presuppone familiarità con i concetti di sfera celeste, equatore celeste ed eclittica. Chi non li conosce può consultare i due articoli della sezione [Fondamenti di Astronomia](/codex/astronomy-fundamentals): [La sfera celeste](/codex/astronomy-fundamentals/celestial-sphere) e [Equatore celeste ed eclittica](/codex/astronomy-fundamentals/equator-ecliptic).

  ## La sfera celeste dipende da dove ci si trova

  La **latitudine** è l'angolo che misura quanto un punto sulla superficie terrestre si trova a nord o a sud dell'equatore: vale 0 gradi all'equatore e 90 gradi ai poli.

  Due osservatori che guardano il cielo nello stesso istante ma da latitudini diverse vedono cieli diversi. Le stelle sono le stesse, ma l'orientamento della sfera celeste rispetto all'orizzonte locale cambia radicalmente.

  ## Il polo celeste e la latitudine

  Il **polo celeste nord** è il punto della sfera celeste attorno al quale tutte le stelle sembrano ruotare. Ogni stella compie un cerchio completo attorno al polo in circa 24 ore. Questo cerchio è lo stesso moto che, visto da Terra, appare come il percorso da est a ovest descritto nell'articolo sulla [sfera celeste](/codex/astronomy-fundamentals/celestial-sphere): la parte del cerchio sopra l'orizzonte è l'arco visibile, la parte sotto è il periodo in cui la stella è sotto l'orizzonte.

  La sua altezza sopra l'orizzonte è uguale alla latitudine dell'osservatore. Questa è una relazione geometrica esatta:

  - A Roma (latitudine 42 gradi nord), il polo celeste nord si trova a 42 gradi sopra l'orizzonte nord
  - A Stoccolma (latitudine 59 gradi), il polo è a 59 gradi
  - All'equatore (latitudine 0), il polo è esattamente sull'orizzonte
  - Al polo nord (latitudine 90 gradi), il polo celeste è allo zenit

  ## Il cielo all'equatore

  All'equatore terrestre, entrambi i poli celesti si trovano sull'orizzonte, uno a nord e uno a sud. L'equatore celeste passa per lo zenit, perpendicolare all'orizzonte.

  Le stelle sorgono verticalmente dall'orizzonte orientale e tramontano verticalmente a occidente. Ogni stella è visibile per esattamente 12 ore e invisibile per 12, indipendentemente dalla sua posizione in cielo.

  ## Il cielo ai poli

  Al polo nord terrestre la situazione è opposta. Il polo celeste nord si trova allo zenit. Le stelle non sorgono e non tramontano: ruotano in cerchi orizzontali, mantenendo sempre la stessa altezza sopra l'orizzonte.

  Le stelle che non scendono mai sotto l'orizzonte si chiamano **circumpolari**. Al polo nord, tutte le stelle dell'emisfero celeste nord sono circumpolari; tutte quelle dell'emisfero sud sono permanentemente invisibili. L'equatore celeste coincide con l'orizzonte.

  ## Il cielo a latitudini intermedie

  A latitudini intermedie come quella di Roma (42 gradi nord), il polo celeste nord si trova a 42 gradi di altezza sopra il punto cardinale nord dell'orizzonte. Le stelle descrivono cerchi attorno al polo celeste e più una stella è vicina al polo celeste, più il suo cerchio è stretto. Quando il cerchio è così stretto da restare interamente al di sopra dell'orizzonte, la stella è circumpolare. Nel diagramma interattivo, le stelle circumpolari corrispondono ai cerchi che non intersecano la linea dell'orizzonte.

  Tutte le altre stelle sorgono e tramontano, ma restano sopra l'orizzonte per tempi diversi. Le stelle più a nord dell'equatore celeste restano visibili più a lungo; quelle più a sud, meno a lungo. Il motivo è semplice: ogni stella traccia un cerchio attorno al polo celeste e più una stella è vicina al polo, più il suo cerchio resta al di sopra dell'orizzonte.

  [LATITUDE_SKY_DIAGRAM]
