semidiurnalArcsContent: |-
  ## Dall'osservazione alla meccanica celeste

  Tre fattori governano il modo in cui i gradi dell'eclittica sorgono all'orizzonte: la [rotazione terrestre](/codex/astronomy-fundamentals/celestial-sphere), l'inclinazione dell'[eclittica](/codex/astronomy-fundamentals/equator-ecliptic) rispetto all'equatore e la [latitudine dell'osservatore](/codex/domification/understanding-placido/latitude-sky). Questo articolo mostra come la loro combinazione produca il fenomeno che sta alla base della domificazione di Placido: il fatto che gradi diversi dell'eclittica impiegano tempi diversi a sorgere.

  ## L'arco semi-diurno

  Quando un corpo celeste sorge all'orizzonte orientale, inizia il suo percorso visibile nel cielo. Traccia un arco fino a raggiungere il punto più alto, la culminazione al meridiano, poi scende fino a tramontare all'orizzonte occidentale.

  L'**arco semi-diurno** (ASD) è la metà di questo percorso: l'arco dal sorgere alla culminazione, oppure dalla culminazione al tramonto.

  Una stella esattamente sull'equatore celeste ha un arco semi-diurno di **6 ore**: sorge, impiega 6 ore per arrivare al meridiano, poi altre 6 ore per tramontare. È sopra l'orizzonte per 12 ore esatte.

  ## Declinazione e arco semi-diurno

  Ma le stelle non si trovano tutte sull'equatore. La **declinazione** di una stella, la sua distanza angolare dall'equatore celeste, influenza la durata del suo arco semi-diurno e questo effetto dipende dalla latitudine dell'osservatore.

  A Roma, 42 gradi nord:

  - Una stella con declinazione 0° (sull'equatore): ASD = 6 ore esatte
  - Una stella con declinazione +20°: ASD = circa 7 ore e 16 minuti
  - Una stella con declinazione -20°: ASD = circa 4 ore e 44 minuti
  - Una stella con declinazione +42° (uguale alla latitudine): ASD = circa 9 ore e 37 minuti

  Maggiore la declinazione verso il polo visibile, più lungo l'arco semi-diurno. Il motivo è geometrico: ogni stella traccia un cerchio attorno al [polo celeste](/codex/domification/understanding-placido/latitude-sky). Se il polo è alto sopra l'orizzonte, le stelle che gli orbitano vicino descrivono cerchi che restano quasi interamente al di sopra della linea dell'orizzonte e quindi rimangono visibili più a lungo. Le stelle lontane dal polo, al contrario, hanno cerchi che passano per lo più al di sotto. L'effetto si amplifica con la latitudine, perché a latitudini più alte il polo celeste è più in alto e la disparità tra i cerchi aumenta.

  [LATITUDE_SKY_DIAGRAM]

  ## L'eclittica all'orizzonte

  L'eclittica è il percorso del Sole e dei pianeti lungo lo zodiaco. A differenza dell'equatore celeste, che mantiene sempre la stessa relazione con l'asse di rotazione, l'eclittica è inclinata di 23,44° rispetto ad esso. Questa inclinazione fa sì che ogni grado dell'eclittica abbia una declinazione propria: si va da +23,44° a 0° Cancro fino a -23,44° a 0° Capricorno, passando per 0° agli equinozi.

  Come abbiamo visto, la declinazione determina la durata dell'arco semi-diurno. Ogni grado dell'eclittica ha quindi un arco semi-diurno diverso: i gradi vicini al Cancro, con alta declinazione positiva nell'emisfero nord, restano sopra l'orizzonte più a lungo; quelli vicini al Capricorno, con declinazione negativa, meno a lungo.

  Ma la conseguenza che più interessa la domificazione è un'altra. La sfera celeste ruota a velocità costante: un giro completo ogni giorno siderale. Eppure l'Ascendente, il grado zodiacale che sorge a est, non avanza nello zodiaco a velocità costante. A volte attraversa molti gradi in un'ora, a volte pochi. La ragione sta nell'angolo con cui l'eclittica incontra l'orizzonte: siccome l'eclittica è un cerchio inclinato, mentre il cielo ruota i suoi diversi tratti arrivano all'orizzonte orientale con inclinazioni diverse.

  [ECLIPTIC_RISING_COMPARISON_DIAGRAM]

  [ECLIPTIC_HORIZON_DIAGRAM]

  Quando l'eclittica taglia l'orizzonte quasi perpendicolarmente, i gradi zodiacali sono disposti uno sopra l'altro. La rotazione li porta verso il basso, non lungo l'orizzonte: ciascuno deve attraversare la linea dell'orizzonte singolarmente. Pochi gradi sorgono in un dato intervallo di tempo. I segni che sorgono in queste condizioni si chiamano segni di **ascensione lunga**.

  Quando l'eclittica corre quasi parallela all'orizzonte, molti gradi giacciono contemporaneamente vicini alla linea dell'orizzonte. La rotazione li spazza oltre il bordo quasi insieme: molti gradi sorgono nello stesso tempo. Questi sono i segni di **ascensione corta**.

  [SEMIDIURNAL_ARC_DIAGRAM]

  Nel diagramma, lo slider della latitudine modifica l'inclinazione complessiva della sfera celeste rispetto all'orizzonte. Lo slider dell'ora mostra la rotazione giornaliera del cielo, cioè il modo in cui l'orizzonte incontra, uno dopo l'altro, i diversi tratti dell'eclittica. All'equatore l'effetto quasi si annulla, perché ogni tratto dell'eclittica incontra l'orizzonte con un angolo simile. A Roma la differenza è già netta e a latitudini più alte diventa più marcata.

  ## Come Placido ricava le case

  A questo punto si vede il passaggio decisivo. L'Ascendente è il grado che sta sorgendo ora a oriente. Il Medio Cielo è il grado che culmina al meridiano. Tra questi due punti c'è un intero tratto dell'eclittica in movimento, ma Placido non lo divide in tre archi uguali di 30 gradi.

  Lo divide in **tre tempi uguali**.

  In pratica prende il tragitto che un grado compie dal sorgere alla culminazione e cerca due soglie temporali intermedie: il punto raggiunto dopo un terzo del tempo e quello raggiunto dopo due terzi. I gradi dell'eclittica che corrispondono a queste due soglie diventano le cuspidi intermedie del quadrante.

  Lo stesso criterio viene applicato agli altri quadranti del tema. Il risultato non è una sequenza di cuspidi distanziate regolarmente di 30 gradi, perché i gradi dell'eclittica non salgono tutti con la stessa velocità. Dove la levata è lenta, la traduzione del tempo in longitudine zodiacale dà un esito; dove la levata è rapida, ne dà un altro.

  Per questo Placido produce case disuguali: il principio di divisione resta uguale, il tempo, ma i gradi zodiacali su cui cade quel tempo cambiano continuamente con latitudine, obliquità e rotazione diurna.

  Il diagramma seguente mostra il risultato concreto: le dodici case di Placido viste dall'alto, con uno slider che permette di variare la latitudine. All'equatore le case sono tutte uguali, perché ogni tratto dell'eclittica sorge con la stessa velocità. Man mano che la latitudine aumenta, la disparità tra le case cresce fino a diventare estrema alle latitudini polari.

  [PLACIDO_DIAGRAM]
semidiurnalArcsTitle: Archi semi-diurni e l'eclittica all'orizzonte
