missionSectionTitle: Our mission
missionText: 'Ours is first and foremost a research mission: we ourselves are curious to discover what is possible with this tool. We use software that considers all factors simultaneously to reach increasingly precise interpretations. AstroGods makes astrological interpretation more accessible to non-experts, while also simplifying the work of astrologers: no matter how skilled or experienced, they must symbolically blend infinite elements. Having a tool that keeps them all in consideration means nothing gets forgotten: a support that enhances, not replaces, human expertise.'
storySectionTitle: Our story
storyText: 'AstroGods was born from a friendship. Arcangelo has always been struck by Jacopo''s ability to describe people with precision based only on their birth date, and to read moments of his life with an inexplicable depth. He wanted to always carry that perspective with him, and so AstroGods was born: an attempt to translate into an algorithm the method Jacopo uses to decipher reality through Astrology.'
