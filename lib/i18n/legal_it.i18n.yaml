definitions: Definizioni e riferimenti legali
definitionsContent: |-
  ### Dati Personali (o Dati)

  Qualunque informazione che, direttamente o indirettamente, anche in collegamento con qualsiasi altra informazione, renda identificata o identificabile una persona fisica.

  ### Dati di Utilizzo

  Sono le informazioni raccolte automaticamente attraverso AstroGods (anche da applicazioni di parti terze integrate in AstroGods), tra cui: gli indirizzi IP o i nomi a dominio dei computer utilizzati dall'Utente che si connette con AstroGods, gli indirizzi in notazione URI (Uniform Resource Identifier), l'orario della richiesta, il metodo utilizzato nell'inoltrare la richiesta al server, la dimensione del file ottenuto in risposta, il codice numerico indicante lo stato della risposta dal server (buon fine, errore, ecc.), il paese di provenienza, le caratteristiche del browser e del sistema operativo utilizzati dal visitatore, le varie connotazioni temporali della visita (ad esempio il tempo di permanenza su ciascuna pagina) e i dettagli relativi all'itinerario seguito all'interno dell'Applicazione, con particolare riferimento alla sequenza delle pagine consultate, ai parametri relativi al sistema operativo e all'ambiente informatico dell'Utente.

  ### Utente

  L'individuo che utilizza AstroGods che, salvo ove diversamente specificato, coincide con l'Interessato.

  ### Interessato

  La persona fisica cui si riferiscono i Dati Personali.

  ### Responsabile del Trattamento (o Responsabile)

  La persona fisica, giuridica, la pubblica amministrazione e qualsiasi altro ente che tratta dati personali per conto del Titolare, secondo quanto esposto nella presente privacy policy.

  ### Titolare del Trattamento (o Titolare)

  La persona fisica o giuridica, l'autorità pubblica, il servizio o altro organismo che, singolarmente o insieme ad altri, determina le finalità e i mezzi del trattamento di dati personali e gli strumenti adottati, ivi comprese le misure di sicurezza relative al funzionamento ed alla fruizione di AstroGods. Il Titolare del Trattamento, salvo quanto diversamente specificato, è il titolare di AstroGods.

  ### AstroGods (o questa Applicazione)

  Lo strumento hardware o software mediante il quale sono raccolti e trattati i Dati Personali degli Utenti.

  ### Servizio

  Il Servizio fornito da AstroGods così come definito nei relativi [termini](/terms-and-conditions) e su questo sito/applicazione.

  ### Unione Europea (o UE)

  Salvo ove diversamente specificato, ogni riferimento all'Unione Europea contenuto in questo documento si intende esteso a tutti gli attuali stati membri dell'Unione Europea e dello Spazio Economico Europeo.

  ### Cookie

  I Cookie sono piccole porzioni di dati conservate all'interno del browser dell'Utente.

  ### Riferimenti legali

  Questa informativa privacy riguarda esclusivamente AstroGods, se non diversamente indicato in questo documento.
