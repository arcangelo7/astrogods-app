severabilityLimitations: Fermo restando quanto sopra, la nullità, invalidità o inefficacia di una specifica disposizione di questi Termini non comporta nullità dell'intero Accordo, a meno che le disposizioni nulle, invalidi o inefficaci nel quadro dell'Accordo siano essenziali o di tale importanza, che le parti non avrebbero concluso il contratto se avessero saputo che la disposizione sarebbe stata invalida, ovvero in casi in cui le disposizioni residue comporterebbero un onere eccessivo ed inaccettabile per una delle parti.
signInWithAppleDescription: Accedi con Apple è un servizio di autenticazione fornito da Apple. Se l'Utente sceglie di nascondere la propria email, AstroGods riceve un indirizzo di inoltro creato da Apple.
stripeBillingAddress: All'interno dell'area di checkout di Stripe, potrebbe essere richiesto agli Utenti di specificare anche il loro indirizzo di fatturazione e di spedizione.
stripeCheckoutAccess: Cliccando sul pulsante di checkout, gli Utenti accedono all'area di checkout di Stripe dove verrà richiesto loro di indicare i propri recapiti e un mezzo di pagamento a loro scelta.
stripeCustomerPortal: Gli utenti possono accedere al Portale Clienti Stripe per visualizzare la cronologia di fatturazione, scaricare fatture, aggiornare i metodi di pagamento e gestire le impostazioni degli abbonamenti. Questo portale è fornito direttamente da Stripe e garantisce l'accesso sicuro alle informazioni di pagamento e fatturazione.
stripeDescription: Stripe è un servizio di pagamento fornito da Stripe Technology Europe Ltd.
stripeExpressCheckout: All'interno dell'area di checkout di Stripe, gli Utenti avranno la possibilità di scegliere il checkout diretto. Il checkout diretto consente agli Utenti di completare l'acquisto direttamente, utilizzando le informazioni di pagamento e i recapiti memorizzati dai più comuni servizi online di gestione dei pagamenti (come "ApplePay", "Google Pay", "Microsoft Pay").
stripePaymentStorage: Gli Utenti che non lo hanno ancora fatto, possono richiedere a Stripe di memorizzare le loro informazioni di pagamento per acquisti futuri su AstroGods o su altri siti che utilizzano Stripe come portale di pagamento. Per ricevere informazioni sul trattamento dei dati personali ed i relativi diritti, l'Utente può consultare la [privacy policy di Stripe](https://stripe.com/privacy) e quella di [AstroGods](/privacy-policy).
stripeRecurringPayments: Per gli abbonamenti acquistati tramite Stripe, Stripe memorizza in sicurezza le informazioni del metodo di pagamento per elaborare automaticamente i pagamenti ricorrenti. Gli utenti possono gestire, aggiornare o annullare i loro metodi di pagamento e abbonamenti tramite il portale clienti accessibile dalle impostazioni del loro account.
subscriptionContinuousProduct: Grazie all'abbonamento, l'Utente riceve un Prodotto in via continuativa o periodica. I dettagli riguardanti il tipo di abbonamento e la risoluzione sono descritti di seguito.
subscriptionTermination: 'Gli abbonamenti possono essere disdetti: (1) per gli acquisti tramite Stripe, dal Portale Clienti Stripe accessibile dalle [impostazioni dell''account](/settings?section=subscriptions); (2) per gli acquisti tramite l''App Store, dalle [impostazioni dell''account Apple](https://apps.apple.com/account/subscriptions); (3) inviando una comunicazione di disdetta chiara al Titolare tramite i [recapiti riportati in questo documento](mailto:contact@astrogods.it).'
subscriptions: Abbonamenti
subscriptionsTitle: Abbonamenti
summary: Sommario
summarySection: Riepilogo
termsAcceptanceRequired: L'Utente è pregato di leggere attentamente questo documento.
