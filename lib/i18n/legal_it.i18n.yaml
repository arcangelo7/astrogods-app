withdrawalFormInstructions: A tal fine, l'Utente può utilizzare il modulo di recesso tipo reperibile nella sezione delle definizioni di questo documento. L'Utente è tuttavia libero di esprimere la propria intenzione di recedere dal contratto in ogni altra forma idonea. Al fine di rispettare il periodo entro il quale dev'essere esercitato il diritto, l'Utente deve inviare la dichiarazione di recesso prima che scada il termine di recesso.
