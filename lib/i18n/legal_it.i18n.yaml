withdrawalRightSummary: A meno che non ricorra un'eccezione, l'Utente potrebbe godere del diritto di recedere dal contratto entro il termine sotto specificato (di norma 14 giorni) per qualsiasi motivo e senza giustificazione. L'Utente può trovare ulteriori informazioni sul diritto di recesso in questa sezione.
