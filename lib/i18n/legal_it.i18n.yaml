paymentFailedDescription: Il pagamento del tuo abbonamento non è stato elaborato. Aggiorna il metodo di pagamento per continuare a utilizzare i nostri servizi.
paymentFailureConsequences: Nel caso in cui il pagamento effettuato con uno dei mezzi disponibili fallisca o venga rifiutato dal fornitore di servizi di pagamento, il Titolare non è obbligato a eseguire l'ordine. Nel caso in cui il pagamento non vada a buon fine, il Titolare si riserva il diritto di richiedere all'Utente il rimborso di qualsiasi spesa o danno correlato.
paymentInformation: Informazioni di pagamento
paymentManagement: Gestione dei pagamenti
paymentManagementDescription: |-
  Se non diversamente specificato, AstroGods elabora tutti i pagamenti con carta di credito, bonifico bancario o altri mezzi tramite fornitori esterni di servizi di pagamento. In generale, e salvo diversa indicazione, gli Utenti sono pregati di fornire i dettagli di pagamento e le informazioni personali direttamente a tali fornitori di servizi di pagamento.
  AstroGods non è coinvolta nella raccolta e nell'elaborazione di tali informazioni: riceverà invece solo una notifica da parte del fornitore di servizi di pagamento in questione circa l'avvenuto pagamento.
paymentManagementTitle: Gestione dei pagamenti
paymentMethods: Mezzi di pagamento
paymentMethodsConditions: Stripe Technology Europe Ltd gestisce i pagamenti effettuati tramite Stripe, mentre Apple gestisce quelli effettuati tramite l'App Store. AstroGods non memorizza né ha accesso ai dettagli delle tue carte di pagamento.
paymentMethodsInfo: Sul sito web e nelle app per Android, Windows e Linux, AstroGods elabora i pagamenti tramite Stripe, un processore di pagamenti certificato conforme PCI DSS. I metodi di pagamento accettati includono le principali carte di credito e debito (Visa, Mastercard, American Express), portafogli digitali (Apple Pay, Google Pay) e altri metodi disponibili tramite Stripe nella tua regione. Nelle app per iPhone, iPad e Mac gli abbonamenti si acquistano tramite l'App Store di Apple, come descritto nella sezione sugli abbonamenti gestiti tramite Apple Account.
paymentObligationRemains: La sospensione o cancellazione di un account per cause addebitabili all'Utente non esonera l'Utente dal pagamento dei compensi o prezzi eventualmente applicabili.
paymentProcessingError: Si è verificato un errore nel processo di pagamento
paymentThirdPartyHandling: Tutti i pagamenti vengono gestiti autonomamente da servizi terzi. Pertanto, AstroGods non raccoglie dati relativi al pagamento – quali numeri di carta di credito – ma riceve una notifica una volta che il pagamento è andato a buon fine. Per ricevere ulteriori informazioni sul trattamento dei dati personali e sui relativi diritti, l'Utente può fare riferimento alla [privacy policy di AstroGods](/privacy-policy).
