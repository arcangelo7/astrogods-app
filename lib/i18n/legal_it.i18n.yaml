dataTypesDetailedContent: |-
  Dettagli completi su ciascuna tipologia di Dati Personali raccolti sono forniti nelle sezioni dedicate di questa privacy policy o mediante specifici testi informativi visualizzati prima della raccolta dei Dati stessi.

  I Dati Personali possono essere liberamente forniti dall'Utente o, nel caso di Dati di Utilizzo, raccolti automaticamente durante l'uso di AstroGods.

  Se non diversamente specificato, tutti i Dati richiesti da AstroGods sono obbligatori. Se l'Utente rifiuta di comunicarli, potrebbe essere impossibile per AstroGods fornire il Servizio. Nei casi in cui AstroGods indichi alcuni Dati come facoltativi, gli Utenti sono liberi di astenersi dal comunicare tali Dati, senza che ciò abbia alcuna conseguenza sulla disponibilità del Servizio o sulla sua operatività.

  Gli Utenti che dovessero avere dubbi su quali Dati siano obbligatori sono incoraggiati a contattare il Titolare.

  AstroGods usa i Cookie solo per fornire il Servizio richiesto dall'Utente, come descritto nella [Cookie Policy](/cookie-policy).

  L'Utente si assume la responsabilità dei Dati Personali di terzi ottenuti, pubblicati o condivisi mediante AstroGods.
