termsAndConditionsTitle: Termini e Condizioni di AstroGods
termsDefinition: Tutte le condizioni applicabili all'utilizzo di AstroGods e/o alla fornitura del Servizio così come descritti in questo documento nonché in qualsiasi altro documento o accordo ad esso collegato, nella versione rispettivamente più aggiornata.
termsDefinitionTitle: Termini
termsGovernText: Questi Termini disciplinano
termsIntroduction: Introduzione
termsIntroductionSection: Introduzione
termsModification: Modifiche dei Termini
termsModificationAcceptance: L'utilizzo continuato del Servizio implica l'accettazione dell'Utente dei Termini aggiornati. Se l'Utente non desidera accettare le modifiche, deve cessare l'utilizzo del Servizio e può recedere dall'Accordo.
termsModificationRight: Il Titolare si riserva il diritto di modificare i Termini in ogni momento. In tal caso, il Titolare darà opportuna notizia delle modifiche agli Utenti.
termsOfUse: Condizioni d'uso
termsOfUseGeneralValidity: Salvo ove diversamente specificato, le condizioni d'uso di AstroGods esposte in questa sezione hanno validità generale.
termsOfUseSection: Condizioni d'uso
termsTableOfContents: Indice
thirdPartyResourcesDisclaimer: Le condizioni applicabili alle risorse fornite da terzi, ivi incluse quelle applicabili a eventuali concessioni di diritti su contenuti, sono determinate dagli stessi terzi e regolate nei relativi termini e condizioni o, in loro assenza, dalla legge.
thisSiteDescription: questo sito web, accessibile tramite browser, inclusi i relativi sottodomini ed ogni altro sito attraverso i quali il Titolare offre il Servizio;
trackingToolsIntro: AstroGods non utilizza strumenti di tracciamento per statistiche o pubblicità. Usa solo i cookie e la memoria del browser necessari al funzionamento, ad esempio per mantenere l'accesso.
trackingToolsSection: Nessun tracciamento
trialAutoConversion: Alla scadenza, il periodo di prova si trasformerà automaticamente nell'equivalente Prodotto a pagamento, a meno che l'Utente non disdica l'acquisto prima che il periodo di prova scada.
trialPeriod: Periodo di prova
trialPeriodAvailability: Gli Utenti hanno la possibilità di provare AstroGods o singoli Prodotti gratuitamente per un periodo di prova di 7 giorni, non rinnovabile. Alcune funzioni o funzionalità di AstroGods potrebbero non essere disponibili durante il periodo di prova. Ulteriori condizioni applicabili al periodo di prova saranno esplicitate su AstroGods.
trustedThirdParties: Terze parti affidabili che ci aiutano a trattarli
typesOfCookiesSection: Tipi di cookie che utilizziamo
unauthorizedResale: Gli Utenti non sono autorizzati a riprodurre, duplicare, copiare, vendere, rivendere o sfruttare AstroGods o il Servizio in toto o in parte senza previo consenso scritto del Titolare, espresso direttamente o attraverso un legittimo programma di rivendite.
unitedStates: Stati Uniti
usageData: Dati di utilizzo
usageRightsReservation: Fino alla ricezione del pagamento del prezzo integrale di acquisto da parte del Titolare, l'Utente non acquista i diritti d'uso dei Prodotti ordinati.
usageRightsReservationTitle: Riserva dei diritti d'uso
useOfService: l'utilizzo di AstroGods e
userActivityLiabilityLimitation: Limitazione della responsabilità per le attività dell'Utente su AstroGods
userAssignmentRestriction: L'Utente non è autorizzato a cedere o trasferire i propri diritti e le proprie obbligazioni secondo i Termini senza il consenso scritto del Titolare.
userCollaborationObligation: Nel caso in cui il Prodotto acquistato richieda un'azione da parte dell'Utente, come la fornitura di informazioni o dati personali, specificazioni o richieste particolari, l'inoltro dell'ordine costituisce in capo all'Utente anche l'obbligo di collaborare di conseguenza.
userExclusiveResponsibility: È responsabilità esclusiva dell'Utente di far sì che l'uso di AstroGods e/o del Servizio non violi la legge, i regolamenti o i diritti di terzi.
userRights: Diritti dell'Utente
userRightsSection: Diritti dell'Utente
usingAccountClosureTools: Usando gli [strumenti di chiusura dell'account](/settings?section=deleteAccount) disponibili su AstroGods.
usingAstroGodsUserDeclares: 'Utilizzando AstroGods l''Utente dichiara di soddisfare i seguenti requisiti:'
viewCookiePolicy: Visualizza Cookie Policy
viewPrivacyPolicy: Visualizza Privacy Policy
violationsOfLaw: violazioni di legge, regolamenti e/o dei Termini;
voucherDefinition: Qualsiasi codice o voucher digitale o cartaceo che consenta all'Utente di acquistare il Prodotto ad un prezzo scontato.
voucherDefinitionTitle: Buono
voucherExpiration: Il Buono deve essere utilizzato entro il termine di validità specificato. Scaduto il termine, il Buono sarà automaticamente annullato. Resta esclusa qualsiasi possibilità di rivendicare diritti, compreso al rimborso del valore del Buono;
voucherFullRedemption: Il Buono può essere riscattato solo integralmente al momento dell'acquisto – non è consentito l'utilizzo parziale;
voucherNoCredit: L'Utente non ha diritto ad alcun accredito/rimborso/compensazione nel caso vi sia differenza tra il valore del Buono e il valore riscattato;
voucherNonCommercialUse: Il Buono è da intendersi esclusivamente ad uso non commerciale. La riproduzione, contraffazione e commercializzazione del Buono sono severamente vietate, così come qualsiasi attività illecita connessa all'acquisto e/o utilizzo del Buono.
voucherSingleUse: Salvo ove diversamente specificato, i Buoni monouso possono essere riscattati una sola volta per acquisto e possono pertanto essere riscattati una sola volta anche nel caso di acquisti rateizzati;
voucherValidityRule: Ciascun Buono è valido solo se utilizzato secondo le modalità e nel periodo di tempo specificati sul sito web e/o sul Buono;
vouchers: Buoni
vouchersAdditionalProvisions: Eventuali disposizioni aggiuntive o divergenti applicabili all'utilizzo dei Buoni riportate nella relativa pagina informativa o sul Buono stesso prevalgono in ogni caso, a prescindere dalle disposizioni che seguono.
vouchersNotCumulative: I Buoni non sono cumulabili;
vouchersPromoForm: Promozioni e sconti possono essere offerti sotto forma di Buoni.
vouchersRules: 'Salvo ove diversamente specificato, le seguenti regole si applicano all''utilizzo dei Buoni:'
vouchersViolationConsequences: In caso di violazione delle condizioni applicabili ai Buoni, il Titolare può legittimamente rifiutare di adempiere ai propri obblighi contrattuali e si riserva espressamente il diritto di agire nelle opportune sedi anche giudiziarie al fine di tutelare i propri diritti e interessi.
whatAreCookiesContent: I cookie sono piccoli file di dati che vengono memorizzati sul tuo computer o dispositivo mobile quando visiti un sito web. Sono ampiamente utilizzati per far funzionare i siti web in modo più efficiente, fornire una migliore esperienza utente e fornire informazioni di reporting.
whatAreCookiesSection: Cosa sono i cookie?
whoHasWithdrawalRights: Chi gode del diritto di recesso
withdrawalDeadlineQuestion: Quando scade il termine di recesso?
withdrawalEffects: Il Titolare rimborsa tutti i pagamenti ricevuti compresi, se effettuati, quelli relativi alle spese di consegna agli Utenti che abbiano correttamente esercitato il diritto di recesso.
withdrawalExercise: Per esercitare il diritto di recesso l'Utente deve inviare al Titolare una comunicazione inequivocabile della propria intenzione di recedere dal contratto.
withdrawalFormAddress: |-
