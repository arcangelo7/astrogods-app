backendApiDescription: Per scrivere le letture, AstroGods sostituisce i nomi delle persone nei temi con un segnaposto. I servizi seguenti ricevono solo le posizioni planetarie calcolate dai dati di nascita, la lingua della lettura e il genere grammaticale da usare nel testo, se l'Utente lo ha indicato. Indicare il genere è facoltativo; se manca, la lettura usa un linguaggio neutro, senza accordi di genere. Non ricevono nomi, date o luoghi di nascita, né dati che identifichino l'Utente o le persone nei temi. AstroGods rimette i nomi veri nel testo sui propri server.
