stripeBillingAddress: Within the Stripe checkout area, Users may also be asked to specify their billing and shipping address.
stripeCheckoutAccess: By clicking the checkout button, Users access the Stripe checkout area where they will be asked to provide their contact details and a payment method of their choice.
stripeCustomerPortal: Users can access the Stripe Customer Portal to view billing history, download invoices, update payment methods, and manage subscription settings. This portal is provided directly by Stripe and ensures secure access to payment and billing information.
stripeDescription: Stripe is a payment service provided by Stripe Technology Europe Ltd.
stripeExpressCheckout: Within the Stripe checkout area, Users will have the possibility to choose express checkout. Express checkout allows Users to complete the purchase directly, using payment information and contact details stored by the most common online payment management services (such as "ApplePay", "Google Pay", "Microsoft Pay").
stripePaymentStorage: Users who have not yet done so, can request Stripe to store their payment information for future purchases on AstroGods or on other sites that use Stripe as a payment gateway. For information on the processing of personal data and related rights, the User can consult the privacy policy of Stripe and AstroGods.
stripeRecurringPayments: For subscription services, Stripe securely stores payment method information to process recurring payments automatically. Users can manage, update, or cancel their payment methods and subscriptions through the customer portal accessible from their account settings.
subscriptionContinuousProduct: Through subscription, the User receives a Product continuously or periodically. Details regarding the type of subscription and termination are described below.
subscriptionTermination: 'Subscriptions can be terminated by: (1) accessing the Stripe Customer Portal through your account settings to cancel immediately, (2) sending a clear cancellation notice to the Owner using the contact details provided in this document, or (3) following the cancellation instructions on AstroGods.'
