definitions: Definitions and Legal References
definitionsContent: |-
  ### Personal Data (or Data)

  Any information that directly, indirectly, or in connection with other information allows for the identification or identifiability of a natural person.

  ### Usage Data

  Information collected automatically through AstroGods (or third-party services employed in AstroGods), which can include: the IP addresses or domain names of the computers utilized by the Users who use AstroGods, the URI addresses (Uniform Resource Identifier), the time of the request, the method utilized to submit the request to the server, the size of the file received in response, the numerical code indicating the status of the server's answer (successful outcome, error, etc.), the country of origin, the features of the browser and the operating system utilized by the User, the various time details per visit (e.g., the time spent on each page within the Application) and the details about the path followed within the Application with special reference to the sequence of pages visited, and other parameters about the device operating system and/or the User's IT environment.

  ### User

  The individual using AstroGods who, unless otherwise specified, coincides with the Data Subject.

  ### Data Subject

  The natural person to whom the Personal Data refers.

  ### Data Processor (or Processor)

  The natural or legal person, public authority, agency or other body which processes Personal Data on behalf of the Controller, as described in this privacy policy.

  ### Data Controller (or Owner)

  The natural or legal person, public authority, agency or other body which, alone or jointly with others, determines the purposes and means of the processing of Personal Data, including the security measures concerning the operation and use of AstroGods. The Data Controller, unless otherwise specified, is the Owner of AstroGods.

  ### AstroGods (or this Application)

  The means by which the Personal Data of the User is collected and processed.

  ### Service

  The service provided by AstroGods as described in the relative terms (if available) and on this site/application.

  ### European Union (or EU)

  Unless otherwise specified, all references made within this document to the European Union include all current member states to the European Union and the European Economic Area.

  ### Cookie

  Cookies are Trackers consisting of small sets of data stored in the User's browser.

  ### Tracker

  Tracker indicates any technology (e.g., Cookies, unique identifiers, web beacons, embedded scripts, e-tags and fingerprinting) that enables the tracking of Users, for example by accessing or storing information on the User's device.

  ### Legal information

  This privacy policy relates solely to AstroGods, if not stated otherwise within this document.
