dataTypesDetailedContent: |-
  Complete details on each type of Personal Data collected are provided in the dedicated sections of this privacy policy or through specific information texts displayed before the collection of the Data.

  Personal Data may be freely provided by the User or, in the case of Usage Data, collected automatically during the use of AstroGods.

  Unless otherwise specified, all Data requested by AstroGods is mandatory. If the User refuses to provide it, it might be impossible for AstroGods to provide the Service. In cases where AstroGods indicates some Data as optional, Users are free to refrain from providing such Data without any consequence on the availability or operation of the Service.

  Users who have doubts about which Data is mandatory are encouraged to contact the Owner.

  Any use of Cookies - or other tracking tools - by AstroGods or the owners of third-party services used by AstroGods serves the purpose of providing the Service requested by the User, in addition to the other purposes described in this document and in the Cookie Policy.

  The User takes responsibility for the Personal Data of third parties obtained, published or shared through AstroGods.
