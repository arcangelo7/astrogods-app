processingDetailsSection: Processing details
processingMethodsContent: |-
  ### Processing methods

  The Owner processes the Personal Data of Users by adopting appropriate security measures aimed at preventing unauthorized access, disclosure, modification or destruction of Personal Data.

  Processing is carried out using computer and/or telematic tools, with organizational methods and logics strictly related to the indicated purposes. In addition to the Owner, in some cases, other subjects involved in the organization of AstroGods (administrative, commercial, marketing, legal personnel, system administrators) or external subjects (such as third-party technical service providers, postal couriers, hosting providers, IT companies, communication agencies) may have access to the Data, also appointed, if necessary, as Data Processors by the Owner. The updated list of Processors can always be requested from the Data Controller.

  ### Location

  Data is processed at the Owner's operating offices and in any other place where the parties involved in the processing are located.

  For further information, contact the Owner.

  The User's Personal Data may be transferred to a country other than the one where the User is located. To obtain further information on the place of processing, the User can refer to the section relating to details on Personal Data processing.

  ### Retention time

  Unless otherwise specified in this document, Personal Data is processed and stored for the time required by the purposes for which it was collected and may be stored for a longer period due to any legal obligations or based on the consent of Users.
