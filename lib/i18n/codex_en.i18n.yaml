equatorEclipticContent: |-
  ## Two circles, two rhythms

  The celestial sphere described in the [previous article](/codex/astronomy-fundamentals/celestial-sphere) needs a coordinate system. Two great circles provide it, and both are projections of real physical phenomena onto the sphere.

  The first is the **celestial equator**: Earth's equator projected outward onto the celestial sphere. It is perpendicular to Earth's rotation axis.

  The second is the **ecliptic**: the apparent path the Sun traces through the stars over the course of a year. It is Earth that orbits the Sun, but from our perspective the Sun appears to move against the background of stars, completing one full circuit in about 365.25 days, roughly 1 degree per day. The ecliptic is the single most important circle in astrology: the zodiac is defined along it, planetary positions are measured along it, the houses are divisions of it.

  ## Obliquity: the tilt

  The ecliptic is not aligned with the celestial equator. It is tilted at an angle of approximately **23.44 degrees**. This tilt, called the **obliquity of the ecliptic**, exists because Earth's rotation axis is not perpendicular to its orbital plane. Earth spins on an axis tilted about 23.44 degrees from the vertical of its orbit.

  If Earth's axis were perfectly vertical relative to its orbit, the ecliptic and the equator would coincide. There would be no seasons, the day would always last 12 hours everywhere, and Astrology would lose much of its structure.

  [EQUATOR_ECLIPTIC_DIAGRAM]

  The slider moves the Sun along the ecliptic over the course of a year.

  At the equinoxes, the Sun sits on the celestial equator: day and night have equal length. At the solstices, the Sun reaches its maximum distance from the equator, producing the longest and shortest days of the year.

  ## Where the circles cross: the equinoxes

  The celestial equator and the ecliptic intersect at exactly two points. These are the **equinoxes**.

  The **vernal equinox** (around March 20) is where the Sun crosses the equator moving northward. This point is designated 0 degrees Aries in the tropical zodiac, and it serves as the origin of both the ecliptic coordinate system and the zodiacal signs.

  The **autumnal equinox** (around September 22) is the opposite crossing, where the Sun moves southward across the equator. This corresponds to 0 degrees Libra.

  At both equinoxes, the Sun sits exactly on the celestial equator, so day and night are approximately equal in length everywhere on Earth.

  ## The solstices

  Halfway between the equinoxes, the Sun reaches its maximum distance from the equator. These points are the **solstices**.

  The **summer solstice** (around June 21) occurs when the Sun reaches its highest point above the celestial equator, 23.44 degrees to the north. This corresponds to 0 degrees Cancer. The **winter solstice** (around December 21) is when the Sun reaches its lowest point, 23.44 degrees south of the celestial equator, corresponding to 0 degrees Capricorn.

  ## The cause of seasons

  The obliquity is the reason seasons exist. When the Sun is on the northern part of the ecliptic (spring and summer in the northern hemisphere), it rises higher in the sky, stays above the horizon longer, and delivers more energy per square meter of ground. When the Sun is on the southern part, the opposite occurs.

  Seasons are not caused by changes in Earth's distance from the Sun. Earth is actually closest to the Sun in January (perihelion) and farthest in July (aphelion). The effect of distance is negligible compared to the effect of axial tilt.

  ## The zodiac

  The zodiac is a band extending roughly 8-9 degrees on each side of the ecliptic. All major planets stay within this band because the solar system is roughly flat: planetary orbits are all close to the same plane.

  The 12 zodiacal signs divide the ecliptic into 12 equal segments of 30 degrees each, starting from the vernal equinox. These are the tropical signs used in Western astrology. They are defined by the equinoxes and solstices, not by the constellations of the same name (which have drifted due to the [precession of the equinoxes](/codex/astronomy-fundamentals/precession)).
