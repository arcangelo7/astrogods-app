placidoIntroContent: |-
  If you are not familiar with the celestial sphere, celestial equator, and ecliptic, we recommend reading the two articles in the [Astronomy fundamentals](/codex/astronomy-fundamentals) section first: [The celestial sphere](/codex/astronomy-fundamentals/celestial-sphere) and [Celestial equator and ecliptic](/codex/astronomy-fundamentals/equator-ecliptic).

  ## Houses: dividing the sky into twelve

  In astrology, the birth chart is divided into twelve houses. Each house governs a domain of experience: identity, resources, communication, home, creativity, and so on. The zodiacal signs and the houses share the number twelve, but they are distinct structures. The signs divide the [ecliptic](/codex/astronomy-fundamentals/equator-ecliptic) into twelve equal segments of 30 degrees. The houses divide it according to the observer's position on Earth at a specific moment.

  The question that separates one house system from another is: how should that division be made?

  ## The Placidus method

  Placido de Titis, a 17th-century Italian monk, proposed a method based on time. His reasoning starts from a simple observation: every point of the ecliptic rises at the eastern horizon, climbs to its highest point at the meridian (the Midheaven), then descends and sets at the western horizon. The time it takes to travel from rising to culmination is the semi-diurnal arc.

  Placidus divides this semi-diurnal arc into three equal time intervals. The ecliptic degrees that mark the one-third and two-thirds boundaries become the house cusps. The same procedure is applied to the descending half (from culmination to setting), producing six houses above the horizon and six below.

  The idea is intuitive: each house represents an equal phase of a degree's journey across the visible sky.

  ## Why it produces unequal houses

  The problem is that different parts of the ecliptic travel at different speeds. Some zodiacal degrees spend many hours above the horizon; others spend far fewer. This asymmetry is caused by two factors: the tilt of the ecliptic relative to the celestial equator, and the observer's geographic latitude.

  When Placidus divides the semi-diurnal arc into equal time segments and then maps those segments back onto the ecliptic, the resulting houses span different numbers of degrees. A house containing degrees of long ascension (slow risers) will be wide; a house containing degrees of short ascension (fast risers) will be narrow. At moderate latitudes like Rome, the difference is noticeable. At high latitudes, it becomes extreme.

  If these concepts are not immediately clear, that is perfectly normal: they are difficult to visualize without graphical support. The articles that follow are designed for exactly this purpose, with interactive diagrams that help build an intuition for the problem.

  ## What comes next

  The articles in this section build the astronomical understanding needed to see exactly how and why this happens:

  1. [How latitude changes the sky](/codex/domification/understanding-placido/latitude-sky) shows how the observer's position on Earth determines the orientation of the entire celestial sphere
  2. [Semi-diurnal arcs and the ecliptic at the horizon](/codex/domification/understanding-placido/semidiurnal-arcs) explains the mechanism that produces unequal rising times
