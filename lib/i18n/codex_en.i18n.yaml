bookOfCavernsIntroduction: |-
  ## Egyptian Funerary Texts and Astrology

  This treatment of the **12 astrological houses** is based on Egyptian funerary texts from the New Kingdom describing the sun god Ra's journey through the underworld, following Angelo Angelini's astrological interpretation.

  ## The Two Source Texts

  The twelve caverns presented here derive from two distinct Egyptian texts:

  ### Caverns 1-6: The Book of Caverns Proper
  A Ramesside funerary text describing Ra's nocturnal journey through six sections of the Duat. Characterized by scenes of punishment for Ra and Osiris's enemies, this text is attested in its most complete versions in the tomb of Ramses VI (KV9) and the Osireion of Seti I at Abydos.

  Contemporary Egyptology maintains that the Book of Caverns actually contains all twelve caverns, organized with multiple caverns per section ([Power, 2015](https://doi.org/10.17638/03032971)). For this astrological treatment, however, we follow Angelini's interpretation that assimilates each of the six sections to an astrological house.

  ### Caverns 8-12: The Book of the Twelve Caves
  Also known as **Spell of the Twelve Caves**, this text was long considered part of the Book of the Dead. Alexandre Piankoff demonstrated it is an independent composition with a benevolent liturgical character: deities grant favors to the deceased without scenes of punishment.

  The first seven caverns of the Book of the Twelve Caves are represented in an extremely synthetic and schematic manner, providing very little information about their content, while only the last five (from 8 to 12) are described in detail.

  Angelo Angelini interprets the eighth cavern of the Book of the Twelve Caves as the eighth astrological house—a symbolic, not philological connection.

  ## The Meaning of "Cavern"

  In Egyptian: **Kerreret** or **Kerret**

  ![Hieroglyph of Kerreret](caverna.webp)

  According to Angelo Angelini, the hieroglyph combines:
  - **Q** (triangle): matter to be worked
  - **Seeds**: time
  - **Open rectangle**: space

  The term thus indicates "a temporal space"—the essence of astrological domification, where celestial time (planetary transits) crystallizes into earthly experience.

  ## Sources

  ### Book of Caverns (caverns 1-6)
  - **Philological reconstruction**: Werning, D. A. (2019). The Book of Caverns in Theban Tomb 33: Late Period reception process and individual adaptation. *Bulletin de l'Institut français d'archéologie orientale*, *118*, 525-554. [https://doi.org/10.4000/bifao.5059](https://doi.org/10.4000/bifao.5059)
  - **Iconographic interpretation**: Power, D. M. (2019). *Aspects of iconography and transmission in the Book of Caverns* [Doctoral dissertation]. University of Liverpool. [https://doi.org/10.17638/03032971](https://doi.org/10.17638/03032971)
  - **Iconographic source**: [Theban Mapping Project](https://thebanmappingproject.com/tombs/kv-09-rameses-v-and-rameses-vi), tomb of Ramses VI

  ### Book of the Twelve Caves (caverns 8-12)
  - **Philological reconstruction**: Méndez Rodríguez, D. M. (2015). The transmission of the Book of the Twelve Caverns. In G. Rosati & M. C. Guidotti (Eds.), *Proceedings of the XI International Congress of Egyptologists* (pp. 405-409). Archaeopress. [https://doi.org/10.2307/j.ctv177tjnf.77](https://doi.org/10.2307/j.ctv177tjnf.77)
  - **Iconographic interpretation**: Piankoff, A. (1974). *The wandering of the soul*. Princeton University Press. [https://archive.org/details/wanderingofsoul0006pian](https://archive.org/details/wanderingofsoul0006pian)
  - **Iconographic source**: [Papyrus EA 10478](https://www.britishmuseum.org/collection/object/Y_EA10478-6), British Museum

  ### Astrological Interpretation
  - Angelini, A. (1992). *Manuale di astrologia egizia*. Kemi.

  **Note**: Colors in illustrations of caverns 1-6 are suggestive and serve a communicative function to evoke the underworld atmosphere, not philological, as the originals on tomb walls are heavily deteriorated. For caverns 8-12, original colors from Papyrus EA 10478 of the British Museum have been used.
celestialSphereContent: |-
  ## Looking up

  Step outside on a clear night, away from city lights, and you see thousands of stars scattered across a dark dome overhead. Watch for an hour or two and something becomes obvious: the stars move. Not relative to each other, though. The entire pattern shifts as a single piece, like a bowl slowly rotating above you. Orion drifts westward. New stars appear on the eastern horizon. Others sink below the west.

  This apparent rotation is, of course, a consequence of Earth spinning on its axis. But for the purposes of observational astronomy and astrology, it is far more practical to work with what you actually see. And what you see is a sphere.

  ## The celestial sphere

  The celestial sphere is an imaginary sphere of arbitrarily large radius, centered on the observer. Every star, planet, and celestial body is projected onto its inner surface. The model is ancient, and it remains useful because angular positions and relationships between objects are the same whether you think of the sky as a sphere or as empty space extending billions of light-years in every direction. What matters is where things appear, not how far away they are.

  The sphere has several reference points defined by the observer's position on Earth.

  ## Reference points

  The **horizon** is the circle that separates the visible half of the celestial sphere (above us) from the invisible half (below us). Four cardinal directions mark the horizon: **North**, **East**, **South**, and **West**. The point directly overhead is the **zenith**; the opposite point, below your feet, is the **nadir**.

  The **meridian** is the imaginary arc that starts at the north horizon, rises to the zenith, and descends to the south horizon. It divides the sky into an eastern half and a western half.

  In the birth chart, these reference points define the four angles. The zodiacal degree rising in the East is the **Ascendant**; the one setting in the West is the **Descendant**. The zodiacal degree at the highest point of the meridian is the **Midheaven** (MC); the opposite point below the horizon is the **Imum Coeli** (IC).

  [CELESTIAL_SPHERE_DIAGRAM]
