latitudeSkyContent: |-
  This article assumes familiarity with the celestial sphere, celestial equator, and ecliptic. If you are not familiar with these concepts, see the two articles in the [Astronomy fundamentals](/codex/astronomy-fundamentals) section: [The celestial sphere](/codex/astronomy-fundamentals/celestial-sphere) and [Celestial equator and ecliptic](/codex/astronomy-fundamentals/equator-ecliptic).

  ## The tilted sphere

  **Latitude** is the angle measuring how far north or south a point on Earth's surface is from the equator: 0 degrees at the equator, 90 degrees at the poles.

  Stand at the north pole and look up. The north celestial pole, the point around which all stars appear to rotate, sits directly at your zenith. Every star traces a full circle around the pole once in about 24 hours. This circular motion is the same east-to-west drift described in the article on the [celestial sphere](/codex/astronomy-fundamentals/celestial-sphere): the portion of each circle above the horizon is the visible arc from rising to setting; the portion below is the time the star is invisible. Stars do not rise or set. They circle horizontally, eternally above or eternally below the horizon.

  Stars that never drop below the horizon are called **circumpolar**. At the north pole, every star in the northern celestial hemisphere is circumpolar; every star in the southern hemisphere is permanently invisible.

  Now travel to the equator. The north celestial pole has dropped all the way to the northern horizon. Stars rise vertically from the east, arc overhead, and set vertically in the west. Every star in the sky is visible for exactly 12 hours out of every 24.

  Between these two extremes, the sky behaves differently at every latitude.

  ## The pole and the latitude

  There is a direct, exact relationship between your geographic latitude and the altitude of the celestial pole above your horizon:

  **The altitude of the celestial pole equals your latitude.**

  At Rome (latitude 42 degrees N), the north celestial pole stands 42 degrees above the northern horizon. At London (51.5 degrees N), it stands 51.5 degrees up. At the equator (0 degrees), it sits on the horizon. At the north pole (90 degrees N), it is at the zenith.

  [LATITUDE_SKY_DIAGRAM]

  ## The sky at intermediate latitudes

  At intermediate latitudes like Rome (42 degrees N), the north celestial pole stands 42 degrees above the north cardinal point on the horizon. Stars trace circles around the celestial pole, and the closer a star is to the celestial pole, the tighter its circle. When the circle is tight enough to remain entirely above the horizon, the star is circumpolar. In the interactive diagram, circumpolar stars correspond to the circles that do not cross the horizon line.

  All other stars rise and set, but they remain above the horizon for different amounts of time. Stars further north of the celestial equator stay visible longer; those further south, for less time. The reason is simple: every star traces a circle around the celestial pole, and the closer a star is to the pole, the more of its circle stays above the horizon.
