semidiurnalArcsContent: |-
  Three factors govern the way ecliptic degrees rise at the horizon: [Earth's rotation](/codex/astronomy-fundamentals/celestial-sphere), the tilt of the [ecliptic](/codex/astronomy-fundamentals/equator-ecliptic) relative to the equator, and the observer's [latitude](/codex/domification/understanding-placido/latitude-sky). This article shows how their combination produces the phenomenon at the heart of Placidus domification: the fact that different ecliptic degrees take different amounts of time to rise.

  ## The arc of a star's day

  Every celestial body that rises and sets traces an arc across the sky. The full arc from rising to setting is the **diurnal arc**. Half of it, from rising to culmination or from culmination to setting, is the **semi-diurnal arc**.

  For a star sitting exactly on the celestial equator, the math is simple. The equator is a great circle perpendicular to the axis of rotation, so it is always cut in half by the horizon. An equatorial star spends exactly 12 hours above the horizon and 12 hours below. Its semi-diurnal arc is exactly 6 hours, or 90 degrees of rotation.

  But most celestial bodies are not on the equator.

  ## Declination and time above the horizon

  A star with positive declination, north of the equator, in the northern hemisphere spends more than 12 hours above the horizon. Its diurnal arc is longer than 180 degrees and its semi-diurnal arc is longer than 90 degrees.

  A star with negative declination spends less than 12 hours up. Its semi-diurnal arc is shorter than 90 degrees.

  The reason is geometric: every star traces a circle around the celestial pole. When the pole is high above the horizon, stars orbiting close to it describe circles that remain almost entirely above the horizon line, so they stay visible longer. Stars far from the pole trace circles that pass mostly below the horizon. The effect grows with latitude, because at higher latitudes the celestial pole is higher and the disparity between the circles increases.

  [LATITUDE_SKY_DIAGRAM]

  The formula connecting declination (d), observer's latitude (L), and the semi-diurnal arc (H) is:

  **cos(H) = -tan(L) x tan(d)**

  At Rome (L = 42 degrees), a star with declination +23.44 degrees, the maximum solar declination at the summer solstice, has a semi-diurnal arc of about 113 degrees, corresponding to roughly 7 hours and 32 minutes. The same calculation for declination -23.44 degrees gives about 67 degrees, or roughly 4 hours and 28 minutes.

  That is a difference of just over three hours. The summer solstice point spends about 15 hours and 4 minutes above the horizon; the winter solstice point spends about 8 hours and 56 minutes.

  ## The ecliptic at the horizon

  Each degree of the ecliptic has a different declination, from +23.44° at 0° Cancer to -23.44° at 0° Capricorn, so each has its own semi-diurnal arc. But Placidus house division rests on a closely related phenomenon: the speed at which ecliptic degrees cross the horizon at the moment of rising.

  The celestial sphere rotates at a constant speed: one full turn per sidereal day. But the Ascendant, the zodiacal degree rising in the east, does not advance through the zodiac at a constant speed. Sometimes it crosses many degrees in an hour and sometimes few. The reason: because the ecliptic is a circle tilted 23.44° from the equator, as the sky rotates its different segments arrive at the eastern horizon at different angles.

  [ECLIPTIC_RISING_COMPARISON_DIAGRAM]

  [ECLIPTIC_HORIZON_DIAGRAM]

  When the ecliptic cuts the horizon nearly perpendicularly, zodiacal degrees are stacked on top of one another. The rotation carries them downward, not along the horizon: each must cross the horizon line individually. Few degrees rise in a given interval of time. These are called **signs of long ascension**.

  When the ecliptic runs nearly parallel to the horizon, many degrees lie near the horizon line simultaneously. The rotation sweeps them past the edge almost together: many degrees rise in the same time. These are **signs of short ascension**.

  [SEMIDIURNAL_ARC_DIAGRAM]

  The latitude slider changes the overall tilt of the celestial sphere relative to the horizon. The hour slider shows the sky's daily rotation: the way the horizon successively meets different parts of the ecliptic. At the equator the effect almost disappears, because every stretch of the ecliptic meets the horizon at a similar angle. At Rome the difference is already clear and at higher latitudes it becomes stronger.

  ## How Placidus derives the houses

  At this point the decisive step becomes visible. The Ascendant is the degree rising now in the east. The Midheaven is the degree culminating at the meridian. Between those two points there is a whole stretch of the ecliptic in motion, but Placidus does not divide it into three equal arcs of 30 degrees.

  It divides it into **three equal times**.

  In practice, it takes the journey a degree makes from rising to culmination and looks for two intermediate temporal thresholds: the point reached after one third of the time and the point reached after two thirds. The ecliptic degrees corresponding to those two temporal thresholds become the intermediate house cusps of that quadrant.

  The same criterion is applied to the other quadrants of the chart. The result is not a sequence of cusps spaced regularly every 30 degrees, because ecliptic degrees do not all rise at the same speed. Where rising is slow, translating time into zodiacal longitude gives one outcome; where rising is fast, it gives another.

  That is why Placidus produces unequal houses: the principle of division remains the same, time, but the zodiacal degrees on which that time falls change continuously with latitude, obliquity, and daily rotation.

  The following diagram shows the concrete result: the twelve Placidus houses seen from above, with a slider to vary the latitude. At the equator all houses are equal, because every stretch of the ecliptic rises at the same speed. As latitude increases, the disparity between houses grows until it becomes extreme near the poles.

  [PLACIDO_DIAGRAM]
semidiurnalArcsTitle: Semi-diurnal arcs and the ecliptic at the horizon
understandingPlacidoTitle: Understanding Placido domification
