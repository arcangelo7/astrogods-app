precessionContent: |-
  ## What is precession?

  The precession of the equinoxes is a slow astronomical movement caused by the Earth behaving like a gigantic gyroscope. The Earth is not a perfect sphere: it is slightly flattened at the poles. The combined gravitational pull of the Sun and Moon on the equatorial bulge causes our planet's axis to trace a circle in space over approximately 25,772 years, in a motion similar to that of a spinning top.

  This motion has an important consequence: the celestial north pole changes position from one epoch to the next and the background stars slowly drift relative to the zodiacal signs. Precession produces a measurable difference between two types of year: the **tropical year** (the time between two successive vernal equinoxes, 365 days 5 hours 48 minutes 45 seconds) and the **sidereal year** (the time for the Sun to return to the same position relative to the fixed stars, 365 days 6 hours 9 minutes 10 seconds). The difference of approximately 20 minutes accumulates over the centuries, revealing the shift of the vernal point.

  [PRECESSION_DIAGRAM]

  ## The discovery of precession

  The first scientific measurement of this discrepancy is owed to Hipparchus of Nicaea (c. 190-120 BCE), who compared his observations with those of his Greek predecessors Timocharis and Aristyllus and detected a 2° shift of the star Spica relative to the autumnal equinox. The thesis that Babylonian astronomers had already formalised the discovery has been refuted [(Neugebauer, 1950)](https://www.jstor.org/stable/595428){{there is no basis visible anywhere in the cuneiform texts of the Seleucid period to support the assumption of a conscious recognition of precession}}. The phenomenon was however observed before Hipparchus: as the Egyptian testimony below will show, temples, dynasties and theology reflect the passage of the vernal point through the constellations. A systematic review of archaeoastronomical evidence has concluded that although definitive proof is still lacking the quantity of hints is remarkable [(Magli, 2004)](https://arxiv.org/pdf/physics/0407108){{Although definitive evidence of the discovery is still lacking, the quantity of hints (for instance, coming from ancient Egypt) is impressive and stimulating}}.

  ## The astrological ages

  As the Earth's axis shifts, the relationship between the equator and the ecliptic changes, and the equinoxes and solstices move by approximately one degree every 71.6 years. The Gamma point (0° Aries), from which ecliptic longitudes are measured in both Astrology and Astronomy, slowly moves backward through the zodiacal constellations:

  - **Age of Aries** (c. 2160-60 BCE): marked by the rise of great military civilizations and the individual hero. From the Egyptian New Kingdom to Persia, from the Greek city-states to the Roman Republic, empires expand through conquest. Aries is a fire sign ruled by Mars: the era's dominant themes are assertion of individual will, military valor, the quest for glory, and the founding of new orders through force and law
  - **Age of Pisces** (from c. 60 BCE): marked by the birth and spread of Christianity, whose earliest symbol is the fish. The Greek word ἰχθύς (ichthýs, "fish") forms the acronym for "Jesus Christ, Son of God, Saviour"; the first Christians used it as a sign of recognition during the persecutions. The era's dominant themes reflect the qualities of the sign: compassion, sacrifice, faith, devotion, seeking salvation through an external spiritual authority
  - **Age of Aquarius**: the next great cycle, whose beginning has been variously estimated between the twenty-second and twenty-seventh century. Aquarius is an air sign: astrological tradition associates it with scientific and technological progress, the pursuit of universal brotherhood and individual freedom, the replacement of blind faith by inner knowledge, and collective consciousness taking the place of obedience to authority

  The dates above are approximate, and the formal concept of precessional ages is more recent than commonly assumed. The first systematic theory linking historical periods to the precession of the equinoxes was formulated not in antiquity but during the French Enlightenment, by Charles-François Dupuis and Constantin-François Volney [(Campion, 2011)](https://constable.blog/wp-content/uploads/15-1_Campion_Age_Aquarius-1.pdf){{there are no extant classical or medieval astrological texts that attribute any astrological or historical significance to precession. Instead the increasing separation between the tropical and sidereal zodiacs was used to discredit astrology}}. There is not a single known example of this use of precession by astrologers before the late nineteenth century. Between the Middle Ages and the Renaissance, astrologers such as Guido Bonatti and Tommaso Campanella regarded the divergence between tropical and sidereal zodiacs as a problem for astrology, not as a forecasting tool. The observation, however, predates the formalization by millennia: as the Egyptian testimony below will show, temples, dynasties and theology reflect the passage of the vernal point through the constellations.

  The astrological zodiac divides the ecliptic into twelve equal arcs of 30 degrees measured from the vernal point; the constellations that share these names span very different sizes and their boundaries, conventionally fixed by the International Astronomical Union in 1930, do not coincide with these divisions. There is no single criterion for establishing the exact moment when one age ends and the next begins, and published estimates span over two thousand years. Johannes Vehlow placed the transition in 1793, coinciding with the French Revolution [(Vehlow, 1934)](http://www.astrologie-chirologie.com/johannes_vehlow_werke/johannes_vehlow_band_VIII.pdf){{So hat sich mit Hilfe der statischen, weltpolitischen Achsen endlich eindeutig feststellen lassen, wo sich gegenwärtig der Frühlingspunkt, am Sternbilderzodiakus gemessen, befindet. Die beiden anfangs erwähnten französischen Autoren hatten mit ihren Feststellungen also recht, und mit ihnen nehmen wir an, daß das Wassermannzeitalter bereits im Jahre 1793, zur Zeit der französischen Revolution begonnen hat!}}; the latest estimate, 2597, is owed to Jean Meeus and rests on the IAU constellation boundaries fixed in 1930 [(Meeus, 1997)](https://openlibrary.org/isbn/9780943396514){{Not until A.D. 2597 will the March equinox cross the boundary into Aquarius.}}. As [argued in the discussion on domification](/codex/domification/why-vehlow), the premise of a calculation is more important than the calculation itself: determining the start of an astrological age on the basis of IAU constellation boundaries amounts to superimposing a modern astronomical criterion on a millennial symbolic system, much as Placidus domification juxtaposes [semi-diurnal arcs](/codex/domification/understanding-placido/semidiurnal-arcs) onto an order that is not astronomical but metaphysical. Equal 30-degree divisions, more consistent with the structure of the astrological zodiac, place the transition around the twenty-second century. The vernal point currently lies within the constellation of Pisces by every calculation method.

  The mundane astrology of Great Conjunctions offers another interpretation of the Aquarian themes attributed to contemporary society, without requiring a change of precessional age.

  Jupiter and Saturn conjoin approximately every twenty years. Their conjunctions form sequences occurring predominantly in signs of the same element, with some interruptions. The conjunctions of 1980–1981 took place in Libra, an Air sign, while the conjunction of 2000 returned to an Earth sign. The conjunction of 21 December 2020 in Aquarius marks the beginning of a series predominantly in Air signs [(Nolle, n.d.)](https://www.astropro.com/features/tables/geo/ju-sa/ju000sa.html){{It begins with the December 21, 2020 alignment and concludes with the 2199 conjunction}}. In an astrological interpretation, this transition can be associated with themes of communication and collective networks, without implying the beginning of the Age of Aquarius.

  ## From Bull to Ram in pharaonic Egypt

  Among the hints that Magli calls "impressive and stimulating," the Egyptian case deserves close examination. In pharaonic Egypt the transition from one animal cult to another can be traced across iconographic, architectural, and textual sources over more than two thousand years.

  ### The three sacred bulls

  Ancient Egypt venerated three sacred bulls, each at a major religious center.

  At Memphis resided the **Apis**, the living manifestation (in Egyptian, the *Ba*) of the creator god Ptah. The cult dates to the First Dynasty, around 3100 BCE [(Simpson, 1957)](https://www.jstor.org/stable/43581573){{Facing the name of the Horus 'Aha is the text: sp tpy pḥrr Ḥp, "the first occasion of the running of the Apis". The text thus provides us with an earlier mention of the running of the Apis than that given for the reign of Dn by the sealing from Saḳḳarah and the text of the Palermo Stone}}. Upon death the bull was mummified and buried in the Serapeum of Saqqara, the necropolis of Memphis discovered by Auguste Mariette in 1851.

  ![The Apis bull, with its characteristic black-and-white markings and the solar disc between its horns](codex/apis.webp)

  At Heliopolis, the **Mnevis**, herald of the sun god Re-Atum. The "bull of Heliopolis" appears in the Pyramid Texts of the Fifth Dynasty (c. 2350 BCE), squarely in the Age of Taurus [(Allen, 2005)](https://archive.org/details/the-ancient-egyptian-pyramid-texts_202103){{Unis has come against you: it is Unis, wild bull of the savannah, a bigfaced bull who comes from Heliopolis — Pyramid of Unis, Recitation 212}}.

  At Hermonthis, the **Buchis**, incarnation of the war god Montu [(Wilkinson, 2003)](https://openlibrary.org/isbn/9780500051207){{Montu could also be represented in the form of his sacred bull, the Buchis, or occasionally in the later dynasties as a bull-headed man}} and living Ba of the sun god Re. The Bucheum, its burial necropolis discovered by Robert Mond and Oliver Myers, preserves stelae that acclaim the bull with this title [(Mond & Myers, 1934)](https://archive.org/details/EXCMEM41_2){{there appeared Buchis, the living Ba of Re, manifestation of Re. He was born in Hermonthis}}.

  Not by chance, in the Egyptian language the word *Ka* means both "bull" and "life force", the spiritual principle that accompanies every person from birth to death: for the ancient Egyptians the bull embodied the life force itself [(Gordon & Schwabe, 2004)](https://doi.org/10.1163/9789047404163){{ka was also the name for 'bull', an equation surely not meaningless to the Egyptians}}.

  ![Left: Ka statue of pharaoh Hor I (ca. 1760 BCE, Egyptian Museum, Cairo). Right: temple relief. The hieroglyph on the head depicts two raised arms, meaning both "bull" and "life force"](codex/ka.webp)

  ### From Montu to Amun

  Between the Old Kingdom and the Middle Kingdom, the capital of Egypt was Thebes, whose chief deity was none other than Montu. The last three rulers of the Eleventh Dynasty bore the name Mentuhotep ("Montu is satisfied"); the Twelfth Dynasty that followed produced four Amenemhats ("Amun is at the forefront") and not a single Mentuhotep. Within a century and a half Amun gradually displaced Montu and rose to the position of supreme god of the entire Egyptian pantheon [(Wilkinson, 2003)](https://openlibrary.org/isbn/9780500051207){{Within a century and a half Amun gradually displaced the old god of that region, Montu, and the ascendancy of the Theban kings in Middle and New Kingdom times eventually propelled him (as the combined Amun-Re) to the position of supreme god of the Egyptian pantheon}}. Amun is a ram-headed god. Amenemhat I moved the capital to Itjtawy, but Thebes remained the religious center of Egypt: the great temple complex of Karnak, originally dedicated to Montu, became the sanctuary of Amun-Re. Its processional avenues are lined with ram-headed sphinxes.

  ![Criosphinxes along the processional avenue of the Karnak temple. Each ram-headed sphinx protects a small figure of the pharaoh between its front paws](codex/karnak.webp)

  The chronology of this transition is noteworthy [(Angelini, 1988)](https://www.kemiassociazione.it){{Verso il 2200 il punto Gamma passa da Toro ad Ariete, cade la XII Dinastia ed in Egitto vi è l'avvento di AMON, la Testa di Ariete}}. The Age of Taurus ends around 2160 BCE; the fall of the Old Kingdom is dated to approximately 2181 BCE. In the Age of Aries that follows, Amun rises to become king of the gods. For over twenty centuries Egyptian theology venerated the bull as supreme symbol in the Age of Taurus and the ram in the Age of Aries.
