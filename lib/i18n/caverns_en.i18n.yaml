eighthCavernEsotericMeaning: |-
  ## The cavern of divine assistance and spiritual discernment

  According to Angelini, the Eighth Cavern represents first and foremost **divine assistance for spiritual ascension**. The deities who "carry those seated upon them to heaven" concretely symbolize how higher spiritual forces provide a vehicle of elevation through profound introspection.

  ## Discernment between truth and falsehood

  The cavern's very name - "She who judges, distinguishing truth from falsehood" - reveals its essential function. The deities described as "judges of souls" represent not an external tribunal, but the **inner discernment process** that every spiritual seeker must develop. The prostrate figures (Groups 3, 4, 5) show the dangers of this search: "Those who mourn for Ra" warn of possible deviations in metaphysical studies and afterlife research.

  ## The duality of spiritual and material resources

  While the second cavern governs earnings from one's own work, the eighth rules **resources received through others**: "Those who carry gifts" and "Those who carry offerings" (Groups 4 and 7) indicate both material gifts (inheritances, legacies) and transformative experiences that arrive unexpectedly. Angelini specifies that these "gifts" may also derive from marriage to wealthier individuals.

  ## The danger of occult research

  The prostrate figures represent the **death-bringing significance of the eighth house**: research in supernatural studies carries real risks. "The Tired Ones" (Group 5) symbolize "those who reach life's end" for having incorrectly traveled the path of hidden knowledge. However, those who succeed in "distinguishing truth from falsehood" can "pass through the Wide Hall of the Two Truths."

  ## The eighth house as alchemical process

  This cavern represents the **alchemical process of death and rebirth** - the dissolution of old forms to allow new spiritual growth. It is the house of radical transformation, where investigation into "hidden things" can lead to both illumination and spiritual destruction.
eighthCavernLiteralMeaning: |-
  The Eighth Cavern, called **"She who protects the Souls, She who judges, distinguishing truth from falsehood"**, is organized into **seven groups of deities**, each with specific functions in the divine organization of the Netherworld.

  ![Structure of the eighth division](ottava_divisione.webp)

  ## Different representations across sources

  Ancient sources present two modes of representation:

  - **In the Osireion at Abydos**: Each group is depicted *in extenso* with all deities (generally four per group) shown in procession
  - **In papyri** (such as British Museum 10.478 shown above): **Each group is symbolically represented by a single figure inscribed in a rectangle**, with the number of group members indicated below the figure. This single deity represents the entire collective.

  ## The Seven Groups of Deities

  ### Group 1: "Those who carry [the ones who are seated] upon them"
  **Papyrus representation**: A deity walking carrying a female child seated on the shoulder, with the number "4" below.
  **Meaning**: Four deities who guarantee the deceased "sees Ra at his rising" and follows him "in Ra's bark."

  ### Group 2: "Those who carry the ones who are [seated] upon them"
  **Papyrus representation**: A deity carrying a male child seated on the shoulder, with the number "4".
  **Meaning**: Four deities who transport specifically male seated figures, granting the same benefits as the first group.

  ### Group 3: "Those who mourn for Ra"
  **Papyrus representation**: A goddess prostrate face down with hair locks hanging before her face and hands raised, with the number "4".
  **Meaning**: Four figures who guarantee "offerings come to the deceased as they come to Ra's followers at his setting."

  ### Group 4: "Those who carry gifts"
  **Papyrus representation**: A goddess prostrate face down with hands raised, with the number "4".
  **Meaning**: Four figures who hold round bread and grant the deceased to "be like those who are in the Netherworld."

  ### Group 5: "The Tired Ones"
  **Papyrus representation**: A goddess prostrate with hair before her face and hands raised inward.
  **Meaning**: Four figures who allow the deceased to "pass through the Wide Hall of the Two Truths."

  ### Group 6: "Those who render homage"
  **Papyrus representation**: A bowing god, with the number "4".
  **Meaning**: Four deities who guarantee the deceased can "follow Ra in his bark."

  ### Group 7: "Those who carry offerings"
  **Papyrus representation**: A god walking holding a conical object.
  **Meaning**: Four deities who grant "offerings and food to the deceased in the Necropolis."
eighthCavernTitle: Eighth cavern - The cavern of transformation
eleventhCavernEsotericMeaning: |-
  ## The cavern of spiritual friendship

  According to Angelini, the Eleventh Cavern **"She who covers the Tired One, who conceals that which is hidden"** reveals its **friendly characteristics** while encompassing both the **joys and sorrows that friendships can bring** in both material and spiritual domains.

  ## Divine support and protection of the weary soul

  The cavern's name reveals its fundamental role: "She who covers the Tired One" refers to **divine protection for the soul weary** from the long spiritual journey. "The Swallower" (Group 1) and "The Soul of the West" (Group 2) represent forces that **welcome and sustain** those needing rest and regeneration. "Those who acclaim" (Group 4) show the **celestial companionship** that encourages the soul toward peace.

  ## Regeneration through sacred mourning

  "The Ennead of Mourners" (Group 10) and "The Ennead of Watchers" (Group 9) reveal a profound aspect: the **regenerative power of shared sorrow**. As the goddesses weep for Osiris guaranteeing his resurrection, so authentic friendships traverse trials together, transforming suffering into spiritual strength. The nine jackals on standards "protect the awakening" showing how true friends watch over our spiritual rebirth.

  ## The serpents of the Enveloper: protection and transformation

  "The Enveloper" (Group 15) and "Those who are in the Enveloper" (Group 16) show how **apparent constraints** can become protection. Like the serpent Mehen that wraps Osiris to protect him, so the limitations imposed by authentic friendships become means of spiritual growth.

  ## Material and spiritual benefits

  Angelini specifies that this cavern governs **"financial situations dependent on the influence of protections and legacies from friends, or strokes of fortune"**. The protective groups show how spiritual friendships manifest concretely: "The Souls of the Earth" (Group 3) grant "pure things," while "The Summoner" (Group 11) brings together the right people at the right time.

  ## The eleventh astrological house

  This cavern corresponds to the **eleventh house**: the house of friendship, hopes, wishes, and **deep scientific and philosophical interests**. Through authentic friendships the soul can reach higher levels of understanding, passing from shared trials (the mourning) to spiritual freedom and transformative protection (the Enveloper).
eleventhCavernLiteralMeaning: |-
  The Eleventh Cavern, called **"She who covers the Tired One, who conceals that which is hidden"**, contains **eighteen groups of deities** embodying themes of protection, regeneration, and spiritual support.

  ![Structure of the eleventh division](undicesima_divisione.webp)

  ## The cavern's name

  The name reveals this dwelling's protective nature: "She who covers the Tired One" refers to divine care for those weary from spiritual journey, while "who conceals that which is hidden" indicates protection of sacred mysteries.

  ## Differences between ancient sources

  As in other caverns:

  **In the Osireion at Abydos**: Each group is shown with all its deities - for example, the ninth group shows nine jackals on standards, the tenth group shows nine prostrate mourning goddesses.

  **In funerary papyri**: Symbolic representation with one figure per group and an indicative number - a single jackal with "9" representing the nine guardians.

  ## The Eighteen Groups of Deities

  ### Group 1: "The Swallower"
  **Representation**: Standing goddess with upright serpent before her, number "1".
  **Meaning**: A goddess who guarantees "prosperity, life, stability and wealth for the Great God in the netherworld".

  ### Group 2: "The Soul of the West"
  **Representation**: Striding god with scepter, number "1".
  **Meaning**: One deity who guarantees "an invocation offering in the Necropolis".

  ### Group 3: "The Souls of the Earth"
  **Representation**: Four striding gods.
  **Meaning**: Four deities who grant "all pure things on earth and before the Great God".

  ### Group 4: "Those who acclaim"
  **Representation**: Four striding gods with raised arms.
  **Meaning**: Four deities who "acclaim so that Osiris may be at ease among those in heaven".

  ### Group 5: "The Ennead of the Ruler of the West"
  **Representation**: Nine mummified gods lying on beds (on serpents in the Osireion).
  **Meaning**: Nine guardians who watch over the western realm of the dead.

  ### Group 6: "The Ennead in the following of Ra"
  **Representation**: Nine mummified gods with hidden arms, lying on serpents and beds.
  **Meaning**: Nine deities who accompany Ra on his journey.

  ### Group 7: "Ikh" (cryptic name)
  **Representation**: Striding god with scepter, number "1".
  **Meaning**: Deity who guarantees being "at the side of the Great God when he traverses the sky".

  ### Group 8: "The Vivifiers of Osiris" (uncertain name)
  **Representation**: Four standing mummiform gods.
  **Meaning**: Deities who give life to Osiris.

  ### Group 9: "The Ennead of Watchers"
  **Representation**: Nine jackals on standards (in the Osireion).
  **Meaning**: Nine guardians who "protect Osiris's awakening so he may never be annihilated".

  ### Group 10: "The Ennead of Mourners"
  **Representation**: Nine prostrate goddesses with hair before faces and hands raised.
  **Meaning**: Nine goddesses who "grant the deceased the same ritual mourning that was done for the god Osiris", ensuring the same funerary honors that enabled divine resurrection.

  ### Group 11: "The Summoner"
  **Representation**: Striding god with one hand raised, number "1".
  **Meaning**: Deity who "summons Osiris before Ra near his ennead".

  ### Group 12: "Iqeheren" (divine name)
  **Representation**: Striding god with scepter, number "1".
  **Meaning**: Deity who "drives away all evil from Osiris forever".

  ### Group 13: "Sacred Head"
  **Representation**: Coiled cobra with woman's head, number "1".
  **Meaning**: Sacred serpent who "helps Osiris to have power over the waters".

  ### Group 14: "Those who are in the Sacred Head"
  **Representation**: Three standing mummiform gods (four in the Osireion).
  **Meaning**: Deities who "help Osiris to enter and exit freely, to move as Lord of the netherworld".

  ### Group 15: "The Enveloper"
  **Representation**: Coiled cobra, number "1".
  **Meaning**: Serpent who wraps and protects.

  ### Group 16: "Those who are in the Enveloper"
  **Representation**: Four striding gods.
  **Meaning**: Deities who enable one to "walk unhindered in the sacred place".

  ### Group 17: "The Ennead of those who conceal Osiris"
  **Representation**: Nine kneeling gods looking back (in the Osireion), prostrate goddess looking back (in papyri).
  **Meaning**: Nine deities who "grant that Osiris be happy in the place he desires".

  ### Group 18: "Ferocious Face"
  **Representation**: Standing mummiform god, number "1".
  **Meaning**: Deity who "opens the eyes to Osiris so he can see Ra's light".
