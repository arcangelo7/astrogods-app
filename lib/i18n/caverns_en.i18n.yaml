fourthCavernEsotericMeaning: |-
  ## The cavern of family

  According to Angelini, the Fourth Cavern represents the **root, paternal home, origin and hearth**. The central figures are members of the divine family: Osiris (the father), Horus (the son and heir), Isis and Nephthys (the sisters who protect and regenerate). These family relationships show how this cavern is the foundation of existence.

  ## The fourth astrological house

  This cavern corresponds to the **fourth house**: the house of family origins and ancestral roots. It is the place where the individual finds their primary identity and sense of belonging. It represents the emotional foundations on which existence is built, the family nucleus that provides security and continuity.
fourthCavernLiteralMeaning: |-
  Division Four consists of 3 registers (R) and 9 scenes (S), the contents of which are contained in the following chart:

  [TABLE_CAVERNA_4]

  ![Structure of the fourth division](quarta_divisione.webp)

  In this division the theme of **Solar-Osirian unity** that began in Division Three continues. The theme is present in the first register (R1, S1) which shows an image of Osiris bent in a crescent shape, with a sun disk at his feet, being lifted by Isis and Nephthys.
