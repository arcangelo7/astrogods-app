twelfthCavernEsotericMeaning: |-
  ## The cavern of the ultimate shore where domification ends

  According to Angelini, **"With the XII Cavern one reaches the end of domification, one reaches the shore beyond which the sea exists"**. This dwelling represents **"the end of domification, the closure of this subliminal circuit"**, poetically compared to **"a shore where one must stop"**.

  ## The great journeys beyond the shore

  Angelini specifies that **"The Twelfth House with the first vignettes indicates the end of domification, but also great journeys, sojourns beyond the shore"** - journeys that are not limited to the ninth house but extend beyond the boundaries of earthly experience. The **Shore Deities** ("He who controls the shore," "The Chief of the shore," "The gods who are on the shore") govern this ultimate boundary where the individual meets the infinite.

  ## The Mysterious Head on the shore: spirituality and suffering

  The **"Mysterious Head on the shore"** (Group 7) - **"a ram's head placed on a pole"** - reveals according to Angelini **"the spirituality of this house, but also, and above all, its negative part, woven with suffering, ineluctable bonds, constraints"**.

  ## The constraining coils and the paradox of liberation

  The distinctive trait of the twelfth house is its **"constraining, immobilizing function, with the many coils of the serpent that trap the god"**. The **"Gods who are in the following of the Enveloper"** and **"The gods who are in the coils"** (Groups 3 and 8) show divine figures **"wrapped in serpent coils"**, representing those who are **"immobilized by external and internal circumstances"**.

  However, as Angelini observes in the general context of the Book of Caverns, apparent constraints can become means of spiritual liberation. The coils that immobilize are also those that protect, following the model of Mehen, the great serpent that wraps Osiris to guard him in his journey of regeneration.

  ## The twelfth astrological house

  This cavern corresponds to the **twelfth house**: the domain of hidden realities, spiritual sacrifice, and ultimate transcendence. It is the place where **"the Neter Kether ends"** (the hidden world) and where earthly domification gives way to the infinite sea of transcendent existence, reached paradoxically through acceptance of final constraints.
twelfthCavernLiteralMeaning: |-
  The Twelfth Cavern, called **"She who unites the gods and embraces their manifestations"**, contains **nine groups of deities** organized around the theme of the sacred shore as the final boundary of the netherworld.

  ![Structure of the twelfth division](dodicesima_divisione.webp)

  ## The Nine Groups of Deities

  ### Groups 1-2, 4-6: The Shore Deities

  **Group 1: "He who controls the shore"** - A striding deity with scepter who guarantees the deceased "may be Lord of the Island of the Just."

  **Group 2: "The gods who are on the shore of the netherworld"** - Thirteen deities (in the Osireion) symbolically represented by one figure in papyri, who grant "truth in the Wide Hall of the Two Truths."

  **Group 4: "The gods who belong to the shore"** - Four mummified deities who "give an island in the Fields of Iaru."

  **Group 5: "The Chief of the shore"** - A deity with scepter who grants "an endowment in the Field of Offerings."

  **Group 6: "The gods who are on the shore"** - Eight deities (four in papyri) who guarantee "offerings, food, and a great quantity of meat in the Necropolis."

  ### Group 7: The Mysterious Heads

  **"The Mysterious Heads on the shore"** - Eleven ram's heads mounted on staffs (in the Osireion), symbolically represented by a single head in papyri. They grant "their protection as it is done for Tired-Heart."

  ### Groups 3 and 8: The Figures in Coils

  **Group 3: "The gods who are in the following of the Enveloper"** - Fourteen recumbent deities wrapped in serpent coils (in the Osireion), who guarantee the deceased "may be in any place in which his Ka desires him to be."

  **Group 8: "The gods who are in the coils"** - Fourteen deities similarly wrapped, who grant "the sight of the Solar Disk."

  ### Group 9: The Bowing Ones

  **Group 9: "iwwtyw"** (cryptic name) - Four bowing deities who guarantee "rest in the beautiful West."
