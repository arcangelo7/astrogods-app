fifthCavernEsotericMeaning: |-
  ## The fifth astrological house

  This cavern corresponds to the **fifth house**: the house of love, creativity and generation. It is the place where vital energy expresses itself through creation, both material and spiritual. It represents children, artistic expression and everything born from the individual's creative impulse.
fifthCavernLiteralMeaning: |-
  Division Five represents **the beginning of the rebirth of the sun god Ra**, as clearly indicated in the ancient texts. It is structured in three registers with fourteen scenes:

  [TABLE_CAVERNA_5]

  ![Structure of the fifth division](quinta_divisione.webp)

  The start of the rebirth process is symbolized by the **large image of Nut** at the beginning of the division, the sky goddess who gives birth to the sun each morning.

  At the center of the division appears the **large figure of ithyphallic Osiris** - Osiris depicted with an erect phallus, symbol of regenerative power and resurrection - that continues the Solar-Osirian unity process: the temporary nightly union of Ra (the sun) with Osiris (regenerative death) necessary for the sun to be reborn each morning.

  Rebirth is further symbolized by **two seated children in an oval** (R1, S3-1), called "The Youth Ra" and "The Child Ra", representing the first manifestations of the sun god. In scene **R1, S1(2)** appear the **pieces of flesh of Osiris**, elements of the dismembered body that must be reassembled to allow resurrection.
fifthCavernTitle: Fifth cavern - The cavern of divine children
firstCavernEsotericMeaning: |-
  ## Sons of earth

  At the entrance to the caverns, Ra addresses the three guardian serpents with the words: "O son of earth". This invocation introduces the fundamental theme of the **terrestrial dimension of domification**: astrological houses are born from the encounter between heaven (the zodiac) and earth (the horizon at the time of birth), rooting cosmic energies in the concrete reality of human experience.

  ## Ovals as magnetic envelopes

  The **ovals that enclose the deities** are traditionally identified as sarcophagi. However, at a deeper level of interpretation, they are to be interpreted as **magnetic envelopes**: auras that surround the divine entities preventing their energies from dispersing. The bodies in their sepulchers are therefore bundles of energies that resolve into matter, enveloped by this magnetic ampule.

  ## The first house

  In astrological terms, the first cavern corresponds to the **first house**: the house of the ascendant, of the self and individual identity. This cavern represents the beginning of the initiatory journey through the twelve astrological houses, where the human soul must confront terrestrial and celestial forces to complete its process of spiritual evolution.
firstCavernLiteralMeaning: |-
  The first division is composed of five registers (R) and 13 scenes (S), with a precise iconographic structure:

  [TABLE_CAVERNA_1]

  ![Division structure](prima_divisione.webp)

  This division begins with three serpentine guardians that Ra must convince to allow him to enter the afterlife.

  This division also contains the first appearance of deities enclosed in ovals and the first appearance of Osiris in a sanctuary. It also includes elements of Osiris' body, represented by the two discs raised above the heads of the deities and by the pieces of flesh that appear in the mounds in R4, S3. The inclusion of parts of Osiris' body symbolizes the elements necessary for **solar-Osirian unity** - the process through which Ra (the daytime sun) and Osiris (the nighttime sun and the regenerative force of death) merge to complete the cosmic cycle of death and rebirth, allowing the daily resurrection of the sun.

  The lower register is finally reserved for the punishment of the enemies of Ra and Osiris.
