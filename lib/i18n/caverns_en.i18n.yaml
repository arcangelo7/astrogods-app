thirdCavernEsotericMeaning: |-
  ## The cavern of spiritual qualities

  According to Angelini, the Third Cavern is characterized by the presence of **Neheb-Kau**, the great primeval serpent god. His name means "He who unites the Ka" and is also conceptually translated as "Bestower of dignities", that is, he who assigns positions and honors in the afterlife. The **Ka** in Egyptian conception is the life force, the spiritual double that distinguishes the living from the dead and must be nourished and preserved to ensure continuity in the afterlife.

  ## The unifier of attributes

  Neheb-Kau is called in ancient texts "unifier of attributes", that is, he who reunites and coordinates the different spiritual qualities and characteristics necessary for complete existence in the afterlife. He is considered the "Ka of every god" and his function was to endow gods and humans with life.

  ## The third astrological house

  This cavern corresponds to the **third house**: the place of gathering elements for the formation of the Spirit. It is the house of instruction, of ideas that form the new personality and of relationships with others. According to Angelini, it represents the centripetal movement directed toward acquiring qualities that nourish the Spirit.
thirdCavernLiteralMeaning: |-
  Division Three consists of 3 registers (R) and 13 scenes (S), the contents of which are contained in the following chart:

  [TABLE_CAVERNA_3]

  ![Structure of the third division](terza_divisione.webp)

  In this division Ra physically enters the Underworld after gaining access from the doorkeepers. This division is the starting point for the **Solar-Osirian unity**, a process necessary for the sun god Ra to be reborn in the morning. The unity is represented in the central scene (R2, S3) where the reposing ithyphallic Osiris appears with a sun disk above his erect phallus.

  ## The catfish-headed deities

  In the first register (R1, S2) appear **7 catfish-headed deities** standing under a serpent. These are associated with the text addressing the "gods who are in the sheepfold of Neheb-Kau".

  ## The double sphinx Aker

  The central scene shows the **double sphinx Aker** with ithyphallic Osiris encircled by a serpent, representing the moment when the unity between Ra and Osiris begins. Aker is the ancient Egyptian earth deity and guardian of the Underworld, depicted as a double sphinx that protects the sun god during his nightly journey through the afterlife.
