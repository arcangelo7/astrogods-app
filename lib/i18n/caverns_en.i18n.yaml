tenthCavernEsotericMeaning: |-
  ## The cavern of worldly achievement and divine recognition

  According to Angelini, the Tenth Cavern is **associated with solar illumination** and demonstrates how **elevation and popularity are achievable through sacrifice**, revealing that social position results from sustained effort and divine favor.

  ## The sacred clamor and inviolable mysteries

  The name "the Clamorous One whose mysteries are sacred" reveals this house's paradoxical nature: **public success** (the clamor) must coexist with **protection of inner mysteries** (the sacred). "Those who belong to the light" (Group 1) represent the illumination that comes from achieving social position and guarantee one "may see Ra at his rising".

  ## The vigilant divine council

  "The Ennead who guard those who are in the earth" (Group 3) represents the **cosmic oversight** that governs worldly success. These nine guardians lying on ritual beds show how earthly power requires constant vigilance and divine protection. Their gift of "the breath of life" indicates that true authority derives from alignment with cosmic vital forces.

  ## The paradox of hidden power

  "The Ennead of those whose arm is hidden" (Group 4) reveals a profound teaching: **true power is often exercised invisibly**. The concealed arms symbolize influence operating behind the scenes, subtle diplomacy, and the wisdom of not displaying all one's capabilities. This group guarantees being "glorious as the accomplished spirits," indicating that true glory derives from inner mastery, not ostentation.

  ## Transformation through sacrifice

  "The souls of the gods who came into being from the limbs of Osiris" (Group 6) - thirty-one deities emanated from the dismembered body of the god - teach that **lasting success requires sacrifice and transformation**. As Osiris was dismembered and reassembled, so those who aspire to power must be willing to sacrifice parts of themselves to be reborn in a higher form. The number 31 (or 21) suggests the days of the lunar month, indicating cycles of rise and fall in power.

  ## Refreshment in the place of heat

  "Those with repulsive faces" (Group 8) who paradoxically grant "refreshment in the place of heat" reveal a profound truth: the **most difficult challenges** (the repulsive faces) in achieving and maintaining power can bring the greatest relief and satisfaction. The "place of heat" represents the pressure and stress of elevated positions, while "refreshment" is the inner peace that comes from overcoming such trials.

  ## The tenth astrological house

  This cavern corresponds to the **tenth house**: the house of career, reputation, public status, and social achievement. It represents the **culmination of earthly ambitions** when aligned with divine will. The groups of deities show that true success requires: illumination (Group 1), ability to "seize" opportunities (Group 2), divine protection (Group 3), hidden wisdom (Group 4), personal mystery (Group 5), transformative sacrifice (Group 6), devotion (Group 7), and the ability to transform adversities into blessings (Group 8).
tenthCavernLiteralMeaning: |-
  The Tenth Cavern, called **"the Clamorous One whose mysteries are sacred"**, contains **eight groups of deities** embodying themes of divine illumination and sacred protection.

  ![Structure of the tenth division](decima_divisione.webp)

  ## The cavern's name

  The name "the Clamorous One" refers to the ritual sounds and sacred invocations that resonate in this domain, while "whose mysteries are sacred" emphasizes the inviolable nature of the divine secrets guarded here.

  ## Differences between ancient sources

  As with other caverns in the Book of the Twelve Caverns, two modes of representation exist:

  **In the Osireion at Abydos** (Seti I's underground temple): Each group is represented with all its deities - for example, the first group shows eight striding gods arranged in two registers, the second group shows eight goddesses pouring water, and so forth.

  **In funerary papyri** (such as British Museum 10.478): For space economy, each group is represented by **a single symbolic figure** accompanied by a number indicating how many deities it represents. Thus a single goddess pouring water with the number "8" represents the entire group of eight goddesses.

  ## The Eight Groups of Deities

  ### Group 1: "Those who belong to the light"
  **Representation**: Eight striding gods arranged in two registers (in the Osireion).
  **Meaning**: Eight solar deities who guarantee the deceased "may see Ra at his rising" and participate in divine luminosity.

  ### Group 2: "Those who seize"
  **Representation**: Eight goddesses pouring water from vessels topped with Anubis heads (in the Osireion).
  **Meaning**: Eight female deities who "seize" souls, guaranteeing the deceased "may be in jubilation".

  ### Group 3: "The Ennead who guard those who are in the earth"
  **Representation**: Nine mummified gods lying on ritual beds.
  **Meaning**: Nine guardians who watch over the dead, granting "the breath of life on earth and in the Necropolis".

  ### Group 4: "The Ennead of those whose arm is hidden"
  **Representation**: Nine standing mummiform gods (in the Osireion, eight gods spitting water).
  **Meaning**: Nine deities with concealed arms who guarantee the deceased "may be glorious as the accomplished spirits".

  ### Group 5: "The Mysterious One"
  **Representation**: A standing goddess, sometimes with the Eye of Horus (Wedjat).
  **Meaning**: A female deity who causes "the soul to endure and the body to prosper like those of the gods in the netherworld".

  ### Group 6: "The souls of the gods who came into being from the limbs of Osiris"
  **Representation**: Thirty-one (or twenty-one in papyri) recumbent deities, organized in groups.
  **Meaning**: Divine souls emanated from Osiris's body, who grant "peace" to the deceased.

  ### Group 7: "The Adorers"
  **Representation**: Four striding gods.
  **Meaning**: Four adorers of Ra who ensure "there is no opposition to the deceased at any gate of the netherworld".

  ### Group 8: "Those with repulsive faces"
  **Representation**: Four striding gods (sometimes represented as a goddess).
  **Meaning**: Four terrifying-looking deities who paradoxically grant "refreshment in the place of heat".
