ninthCavernEsotericMeaning: |-
  ## The cavern of metaphysical order and profound religiosity

  According to Angelini, the Ninth Cavern represents the **metaphysical, religious, juridical, and mystical order**. Group 1 - "The gods in their temples above the Watery Abyss" - immediately reveals the **profound religiosity** of this house, where the mummified figure of Osiris in the temple establishes the sacred and spiritual character of the domain.

  ## The higher spiritual principles

  The deities "in their temples above the Waters of the Abyss (Nu)" (Group 1) represent the **higher spiritual principles** that govern from above. These fourteen gods who allow one to "drink from the middle of the stream" symbolize access to higher knowledge through **elevated consciousness** that transcends the chaotic primordial waters.

  ## The duality of divine justice

  The numerous groups (5, 8, 10, 12, 13, 14, 17) that Angelini identifies as the realm of justice show the **dual nature** of this cavern. The "Hidden-Armed Figures" (Groups 12-14) represent those who have lost worldly means: the "gods without hands" symbolize loss of work and material means. However, through this loss one can reach **higher knowledge** - the mystic's path that gains spiritual wealth through material renunciation.

  ## Magical power and earthly justice

  The bulls on standards with uraeus (Groups 4, 6, 7) who "give power to Osiris in heaven and earth" represent **magical power** operating through natural forces. This can manifest both as divine justice and as **loss of freedom** through earthly tribunal judgments. The "Protective Deities" (Groups 8-11) show how moral discipline and spiritual ascension allow one to reach **self-knowledge** through infinite trials: illness, infirmities, worldly losses.

  ## Spiritual religion through adversity

  "The Souls who come forth" (Group 16) and "The Bright Ones" (Group 19) indicate the positive result of the spiritual path, while "He of the Repugnant Face" (Group 18) warns of the dangers of deviation. The house reveals how through **moral discipline and spiritual ascension** one can reach authentic spiritual religion, transforming trials into higher wisdom.

  ## The ninth astrological house

  This cavern corresponds to the **ninth house**: the house of philosophy, religion, law, higher studies, and long journeys. Angelini clearly identifies this domain as the realm of **metaphysical, religious, juridical, and mystical order**. Here both divine and earthly justice manifest - the tribunals that can take away freedom, but also the moral discipline that leads to spiritual liberation. It is the house where one accesses **higher knowledge** through direct experience of spiritual trials, transforming adversity into wisdom.
ninthCavernLiteralMeaning: |-
  The Ninth Cavern, called **"She of mysterious forms, who cuts off the [vital] air"**, is organized into **twenty groups of deities**, the most complex among all caverns.

  ![Structure of the ninth division](nona_divisione.webp)

  ## Different representations across sources

  As with the Eighth Cavern, sources present two modes:
  - **In the Osireion at Abydos**: Each group shown with all deities
  - **In papyri**: Symbolic representation with one figure per group

  ## The Twenty Groups of Deities

  ### Group 1: "The gods who are in their shrines above the Watery Abyss"
  **Representation**: Mummified figure of Osiris with Upper Egyptian crown in shrine with serpents, number "14".
  **Meaning**: Fourteen deities who guarantee the deceased "may drink from the middle of the stream".

  ### Group 2: "The gods and goddesses who are in the following of Osiris"
  **Representation**: Standing goddess followed by god with scepter, number "24".
  **Meaning**: Twenty-four deities (12 gods and 12 goddesses) who enable the deceased to "repose with his mummy".

  ### Group 3: "The Standing One"
  **Representation**: Striding god with scepter, number "1".
  **Meaning**: One deity who guarantees the deceased "may adore Ra at his rising".

  ### Groups 4, 6-7: Taurine Deities
  **Group 4**: "Amun-Osiris" - Bull on standard with uraeus who grants "power in the Wide Hall of Geb". The **uraeus** is the sacred rearing cobra, symbol of sovereignty and divine protection, that adorned pharaohs' foreheads and represented the goddess Wadjet.
  **Group 6**: "He who nourishes Osiris" - Bull on standard carried by mummiform god, grants bread and beer to the deceased
  **Group 7**: "He who makes Osiris inaccessible" - Bull on standard that protects Osiris in the underworld, grants mastery of steps in the Holy Place

  ### Group 5: "The Mysterious One"
  **Representation**: Standing mummiform god.
  **Meaning**: Deity who guarantees the deceased "an enduring and healthy body".

  ### Groups 8-11: Protective Deities
  **Group 8**: "The Protector" - Mummiform god who does not allow evil to approach the deceased
  **Group 9**: "He who Tows Osiris" - Deity who guides Osiris through the afterlife, allows seeing Ra
  **Group 10**: "The Dark One" - Mummiform god who grants glory on earth and power in the West
  **Group 11**: "He-who-is-between-the-two-eyes" - Crocodile-headed god who brings the deceased before the sacred braziers

  ### Groups 12-14: Hidden-Armed Figures
  **Group 12**: "The assistants of Osiris" - Four mummified goddesses who accompany the deceased beside the Great God of the West
  **Group 13**: "Those with hidden arms" (masculine) - Four mummiform gods with arms concealed under garments, guarantee the deceased remains in the Necropolis forever
  **Group 14**: "Those with hidden arms" (feminine) - Four mummified goddesses with concealed arms, ensure prosperity and lasting offerings

  ### Groups 15-20: Specialized Deities
  **Group 15**: "He who hides the limbs" - God with scepter
  **Group 16**: "The Souls who come forth" - Four birds on trees
  **Group 17**: "Those of the sycamores" - Four mummified gods
  **Group 18**: "He of the Repugnant Face" - Mummiform god
  **Group 19**: "The Bright Ones" - Nine gods with solar disks
  **Group 20**: "Those who rest on their beds" - Nine reclining gods
ninthCavernTitle: Ninth cavern - The cavern of divine wisdom
secondCavernEsotericMeaning: |-
  ## The cavern of nourishment

  According to Angelini, the Second Cavern has nourishment and abundance as its central theme. Ra addresses the deities: "I illuminate you, oh afflicted ones, and make you satisfied with your sustenance". The **Nariu** are primeval gods of abundance and nourishment, represented with catfish heads.

  ## The second astrological house

  This cavern corresponds to the **second house**: the place where the individual finds the resources necessary for their physical survival. It is the house of earnings and income, which reveals the impulse to gather and accumulate everything needed to maintain and protect material existence.
secondCavernLiteralMeaning: |-
  Division Two consists of five registers (R) and 10 scenes (S), the contents of which are contained in the following chart:

  [TABLE_CAVERNA_2]

  ![Structure of the second division](seconda_divisione.webp)

  This division begins, like the first, with serpent doorkeepers whom Ra must convince to gain access to the Underworld. It contains various groups of ovals with solar and Osirian elements.

  ## The catfish-headed deities

  The **catfish-headed deities** (R1, S2) are called **Nariu** and are associated with the inscription: "O Nariu, lords of sustenance, who have become as Osiris...".

  ## The death of Osiris

  The death of Osiris is highlighted by the **deities who mourn him** (R2, S1) and by the deities who guard a **chest containing the body of Osiris** (R3, S2).
secondCavernTitle: Second cavern - The cavern of sustenance
secondDivisionTitle: Division Two
seventhCavernEsotericMeaning: |-
  ## The seventh astrological house

  This cavern corresponds to the **seventh house**: the house of partnerships, marriage, open enemies, and legal contracts. However, according to Angelini, **"Della settima casa nulla si può dire poichè non si hanno elementi di discusione"** ("Of the seventh house nothing can be said since there are no elements for discussion").

  ## The passage from night to day

  The seventh cavern represents **the passage from the nocturnal to the diurnal part of domification**, namely that below the ascendant line and that above the ascendant line. The complete absence of this cavern from all sources - both the Osireion reliefs and the papyri - keeps hidden the esoteric meaning of this transitional house.
seventhCavernLiteralMeaning: |-
  Following Angelo Angelini's interpretation, the **first six caverns** correspond to the six sections of the Book of the Twelve Caverns in the Osireion at Abydos, while the **other caverns are represented only in papyri**.

  According to this interpretation, the Seventh Cavern has **no attestation** in either source: it is absent from the Osireion reliefs and **"Manca nei Papiri"** ("Missing in the Papyri") as Angelini explicitly states.
seventhCavernTitle: Seventh cavern - The cavern of the sacred union
sixthCavernEsotericMeaning: |-
  ## The sixth astrological house

  This cavern corresponds to the **sixth house**: the house of work, health and service, which **ends the dark zone of domification**. It is the house of **defeating chaos**, symbolized by the decapitated heads (R3, S1) representing the forces of disorder definitively vanquished.

  The Sixth House represents the **fulcrum of spiritual transformation through sacrifice**. It is the place where, through discipline, service and acceptance of difficulties, the individual defeats inner chaos and can access higher planes of awareness. Just as Ra is reborn every morning after defeating the forces of nightly chaos, so sacrifice becomes an instrument of regeneration, transforming suffering into spiritual growth.
sixthCavernLiteralMeaning: |-
  Division Six represents **the completion of the rebirth process** begun in the fifth division. It is structured in three registers with thirteen scenes:

  [TABLE_CAVERNA_6]

  ![Structure of the sixth division](sesta_divisione.webp)

  The central theme is the **imminent birth of the sun god Ra**. This is symbolized by the figure of the **scarab beetle emerging from between two mounds** (R2, S1), an image representing the sun god about to be born after completing his nightly journey through the Underworld.

  The division also contains other figures connected to rebirth: the image of **Tatenen** (R2, S3), funerary deity representing the land that emerged from primordial Chaos, creator of primordial energy, **rams** (R1, S2) and **ram heads** (R1, S3 and R2, S3), all symbols associated with the sun god and the regenerative process.

  The lower register maintains the customary representation of **decapitated enemies** (R3, S1), symbolizing the defeat of the forces of chaos that oppose solar rebirth.
sixthCavernTitle: Sixth cavern - The cavern of service
