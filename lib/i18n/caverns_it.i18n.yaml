fifthCavernEsotericMeaning: |-
  ## La quinta casa astrologica

  Questa caverna corrisponde alla **quinta casa**: la casa dell'amore, della creatività e della generazione. È il luogo dove l'energia vitale si esprime attraverso la creazione, sia materiale che spirituale. Rappresenta i figli, l'espressione artistica e tutto ciò che nasce dall'impulso creativo dell'individuo.
fifthCavernLiteralMeaning: |-
  La Quinta Divisione rappresenta **l'inizio della rinascita del dio sole Ra**, come indicato chiaramente nei testi antichi. È strutturata in tre registri con quattordici scene:

  [TABLE_CAVERNA_5]

  ![Struttura della quinta divisione](quinta_divisione.webp)

  L'avvio del processo di rinascita è simboleggiato dalla **grande immagine di Nut** all'inizio della divisione, la dea del cielo che partorisce il sole ogni mattina.

  Al centro della divisione appare la **grande figura di Osiride itifallico** - Osiride rappresentato con il fallo eretto, simbolo di potenza rigeneratrice e di resurrezione - che continua il processo di unità Solare-Osiriaca: il temporaneo unirsi notturno di Ra (il sole) con Osiride (la morte rigeneratrice) necessario perché il sole possa rinascere ogni mattina.

  La rinascita è ulteriormente simboleggiata da **due bambini seduti in un ovale** (R1, S3-1), chiamati "Il Giovane Ra" e "Il Bambino Ra", che rappresentano le prime manifestazioni del dio sole. Nella scena **R1, S1(2)** appaiono i **pezzi di carne di Osiride**, elementi del corpo smembrato che devono essere ricomposti per permettere la resurrezione.
fifthCavernTitle: Quinta caverna - La caverna dei bambini divini
firstCavernEsotericMeaning: |-
  ## Figli della terra

  All'ingresso delle caverne, Ra si rivolge ai tre Serpenti guardiani con le parole: "O Figlio della Terra". Questa invocazione introduce il tema fondamentale della **dimensione terrestre della domificazione**: le case astrologiche nascono dall'incontro tra il cielo (lo Zodiaco) e la Terra (l'orizzonte al momento della nascita), radicando le energie cosmiche nella realtà concreta dell'esperienza umana.

  ## Gli ovali come involucri magnetici

  Gli **ovali che racchiudono le divinità** vengono tradizionalmente identificati come sarcofagi. Tuttavia, a un livello di interpretazione più profonda, sono da interpretarsi come **involucri magnetici**: aure che circondano le entità divine impedendo che le loro energie si disperdano. I corpi nei loro sepolcri sono quindi fasci di energie che si risolvono in materia, avviluppati da questa ampolla magnetica.

  ## La prima casa

  In termini astrologici, la Prima Caverna corrisponde alla **Prima Casa**: la casa dell'Ascendente, del Sé e dell'identità individuale. Questa caverna rappresenta l'inizio del percorso iniziatico attraverso le dodici case astrologiche, dove l'anima umana deve confrontarsi con le forze terrestri e celesti per completare il proprio processo di evoluzione spirituale.
firstCavernLiteralMeaning: |-
  La Prima Divisione è composta da 5 registri (R) e 13 scene (S), con una precisa struttura iconografica:

  [TABLE_CAVERNA_1]

  ![Struttura della divisione](prima_divisione.webp)

  Questa divisione inizia con tre guardiani serpentini che Ra deve convincere per permettergli di entrare nell'Oltretomba.

  Questa divisione contiene anche la prima apparizione di divinità racchiuse in ovali e la prima apparizione di Osiride in un santuario. Include inoltre elementi del corpo di Osiride, rappresentati dai due dischi sollevati sopra le teste delle divinità e dai pezzi di carne che appaiono nei tumuli nel R4, S3. L'inclusione di parti del corpo di Osiride simboleggia gli elementi necessari per l'**unità Solare-Osiriaca** - il processo attraverso cui Ra (il sole diurno) e Osiride (il sole notturno e la forza rigeneratrice della morte) si fondono per completare il ciclo cosmico di morte e rinascita, permettendo la resurrezione quotidiana del sole.

  Il registro inferiore è infine riservato alla punizione dei nemici di Ra e Osiride.
firstCavernTitle: Prima caverna - Il portale dell'ingresso
firstDivisionTitle: Prima Divisione
fourthCavernEsotericMeaning: |-
  ## La caverna della famiglia

  Secondo Angelini, la Quarta Caverna rappresenta la **radice, la casa paterna, l'origine e il focolare**. Le figure centrali sono i membri della famiglia divina: Osiride (il padre), Horus (il figlio ed erede), Iside e Nefti (le sorelle che proteggono e rigenerano). Questi rapporti familiari rivelano la natura della caverna come fondamento dell'esistenza.

  ## La quarta casa astrologica

  Questa caverna corrisponde alla **quarta casa**: la casa delle origini familiari e delle radici ancestrali. È il luogo dove l'individuo trova la propria identità primaria e il senso di appartenenza. Rappresenta le basi emotive su cui si costruisce l'esistenza, il nucleo familiare che fornisce sicurezza e continuità.
fourthCavernLiteralMeaning: |-
  La Quarta Divisione è composta da 3 registri (R) e 9 scene (S), il cui contenuto è contenuto nella seguente tabella:

  [TABLE_CAVERNA_4]

  ![Struttura della quarta divisione](quarta_divisione.webp)

  In questa divisione continua il tema dell'**unità Solare-Osiriaca** iniziata nella Terza Divisione. Il tema è presente nel primo registro (R1, S1) che mostra un'immagine di Osiride piegato a forma di mezzaluna, con un disco solare ai suoi piedi, sollevato da Iside e Nefti.
