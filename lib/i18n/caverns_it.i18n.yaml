ninthCavernEsotericMeaning: |-
  ## La caverna dell'ordine metafisico e della religiosità profonda

  Secondo Angelini, la Nona Caverna rappresenta l'**ordine metafisico, religioso, giuridico e mistico**. Il Gruppo 1 - "Gli dei nei loro templi sopra l'Abisso Acquatico" - rivela immediatamente la **religiosità profonda** di questa casa, dove la figura mummificata di Osiride nel tempio stabilisce il carattere sacro e spirituale del dominio.

  ## I principi spirituali superiori

  Le divinità "nei loro templi sopra le Acque dell'Abisso (Nu)" (Gruppo 1) rappresentano i **principi spirituali superiori** che governano dall'alto. Questi quattordici dei che permettono di "bere nel mezzo della corrente" simboleggiano l'accesso alla conoscenza superiore attraverso la **coscienza elevata** che trascende le acque primordiali caotiche.

  ## La dualità della giustizia divina

  I numerosissimi gruppi (5, 8, 10, 12, 13, 14, 17) che Angelini identifica come regno della giustizia mostrano la **natura duale** di questa caverna. Le "Figure con Braccia Nascoste" (Gruppi 12-14) rappresentano coloro che hanno perduto i mezzi mondani: gli "dei senza mani" simboleggiano la perdita del lavoro e dei mezzi materiali. Tuttavia, attraverso questa perdita si può raggiungere la **conoscenza superiore** - il sentiero del mistico che guadagna ricchezza spirituale attraverso la rinuncia materiale.

  ## Il potere magico e la giustizia terrena

  I tori su stendardi con l'ureo (Gruppi 4, 6, 7) che "danno potere a Osiride in cielo e in terra" rappresentano il **potere magico** che opera attraverso le forze naturali. Questo può manifestarsi sia come giustizia divina che come **perdita della libertà** attraverso giudizi tribunali terreni. Le "Divinità Protettive" (Gruppi 8-11) mostrano come la disciplina morale e l'ascensione spirituale permettano di giungere alla **conoscenza di sé** attraverso infinite traversie: malattia, infermità, perdite mondane.

  ## La religione spirituale attraverso l'avversità

  "Le Anime che escono" (Gruppo 16) e "Gli Splendenti" (Gruppo 19) indicano il risultato positivo del cammino spirituale, mentre "Colui dal Volto Ripugnante" (Gruppo 18) avverte dei pericoli della deviazione. La casa rivela come attraverso la **disciplina morale e l'ascensione spirituale** si possa raggiungere l'autentica religione spirituale, trasformando le prove in saggezza superiore.

  ## La nona casa astrologica

  Questa caverna corrisponde alla **nona casa**: la casa della filosofia, religione, legge, studi superiori e lunghi viaggi. Angelini identifica chiaramente questa dimora come regno dell'**ordine metafisico, religioso, giuridico e mistico**. Qui si manifesta sia la giustizia divina che quella terrena - i tribunali che possono togliere la libertà, ma anche la disciplina morale che conduce alla liberazione spirituale. È la casa dove si accede alla **conoscenza superiore** attraverso l'esperienza diretta delle prove spirituali, trasformando l'avversità in saggezza.
ninthCavernLiteralMeaning: |-
  La Nona Caverna, chiamata **"Colei dalle forme misteriose, che taglia l'aria [vitale]"**, è organizzata in **venti gruppi di divinità**, il più complesso tra tutte le caverne.

  ![Struttura della nona divisione](nona_divisione.webp)

  ## Rappresentazioni diverse tra le fonti

  Come per l'Ottava Caverna, le fonti presentano due modalità:
  - **Nell'Osireion di Abydos**: Ogni gruppo mostrato con tutte le divinità
  - **Nei papiri**: Rappresentazione simbolica con una figura per gruppo

  ## I Venti Gruppi di Divinità

  ### Gruppo 1: "Gli dei che sono nei loro templi sopra l'Abisso Acquatico"
  **Rappresentazione**: Figura mummificata di Osiride con corona dell'Alto Egitto in un tempio con serpenti, numero "14".
  **Significato**: Quattordici divinità che garantiscono al defunto di "bere nel mezzo della corrente".

  ### Gruppo 2: "Gli dei e dee che sono al seguito di Osiride"
  **Rappresentazione**: Dea in piedi seguita da un dio con scettro, numero "24".
  **Significato**: Ventiquattro divinità (12 dei e 12 dee) che permettono al defunto di "riposare con la sua mummia".

  ### Gruppo 3: "Colui che Sta in Piedi"
  **Rappresentazione**: Dio che cammina con scettro, numero "1".
  **Significato**: Una divinità che garantisce al defunto di "adorare Ra al suo sorgere".

  ### Gruppi 4, 6-7: Divinità Taurine
  **Gruppo 4**: "Amun-Osiride" - Toro su stendardo con ureo che concede "potere nella Grande Sala di Geb". L'**ureo** è il cobra sacro eretto, simbolo di sovranità e protezione divina, che ornava la fronte dei faraoni e rappresentava la dea Wadjet.
  **Gruppo 6**: "Colui che nutre Osiride" - Toro su stendardo portato da dio mummiforme, concede pane e birra al defunto
  **Gruppo 7**: "Colui che rende Osiride inaccessibile" - Toro su stendardo che protegge Osiride nel mondo sotterraneo, concede padronanza dei passi nel Luogo Sacro

  ### Gruppo 5: "Il Misterioso"
  **Rappresentazione**: Dio mummiforme in piedi.
  **Significato**: Divinità che garantisce al defunto un "corpo duraturo e sano".

  ### Gruppi 8-11: Divinità Protettive
  **Gruppo 8**: "Il Protettore" - Dio mummiforme che non permette al male di avvicinarsi al defunto
  **Gruppo 9**: "Colui che Traghetta Osiride" - Divinità che guida Osiride attraverso l'oltretomba, permette di vedere Ra
  **Gruppo 10**: "L'Oscuro" - Dio mummiforme che concede gloria sulla terra e potere nell'Occidente
  **Gruppo 11**: "Colui-che-è-tra-i-due-occhi" - Dio dalla testa di coccodrillo che porta il defunto davanti ai bracieri sacri

  ### Gruppi 12-14: Figure con Braccia Nascoste
  **Gruppo 12**: "Gli assistenti di Osiride" - Quattro dee mummificate che accompagnano il defunto accanto al Grande Dio dell'Occidente
  **Gruppo 13**: "Quelli dalle braccia nascoste" (maschili) - Quattro dei mummiformi con braccia celate sotto le vesti, garantiscono al defunto di rimanere nella Necropoli per sempre
  **Gruppo 14**: "Quelle dalle braccia nascoste" (femminili) - Quattro dee mummificate con braccia celate, assicurano prosperità e offerte durature

  ### Gruppi 15-20: Divinità Specializzate
  **Gruppo 15**: "Colui che nasconde le membra" - Dio con scettro
  **Gruppo 16**: "Le Anime che escono" - Quattro uccelli su alberi
  **Gruppo 17**: "Quelli dei sicomori" - Quattro dei mummificati
  **Gruppo 18**: "Colui dal Volto Ripugnante" - Dio mummiforme
  **Gruppo 19**: "Gli Splendenti" - Nove dei con dischi solari
  **Gruppo 20**: "Quelli che si riposano sui loro letti" - Nove dei coricati
ninthCavernTitle: Nona caverna - La caverna della saggezza divina
secondCavernEsotericMeaning: |-
  ## La caverna del nutrimento

  Secondo Angelini, la Seconda Caverna ha come tema centrale il nutrimento e l'abbondanza. Ra si rivolge alle divinità: "Io vi illumino, o afflitte, e vi rendo soddisfatte con il vostro sostentamento". I **Nariu** sono dei primevi dell'abbondanza e del nutrimento, rappresentati con la testa di pesce gatto.

  ## La seconda casa astrologica

  Questa caverna corrisponde alla **seconda casa**: il luogo dove l'individuo trova le risorse necessarie per la propria sopravvivenza fisica. È la casa dei guadagni e delle entrate, che rivela l'impulso di raccogliere e accumulare tutto ciò che serve per mantenere e proteggere l'esistenza materiale.
secondCavernLiteralMeaning: |-
  La Seconda Divisione è composta da 5 registri (R) e 10 scene (S), il cui contenuto è contenuto nella seguente tabella:

  [TABLE_CAVERNA_2]

  ![Struttura della seconda divisione](seconda_divisione.webp)

  Questa divisione inizia, come la prima, con guardiani serpentini che Ra deve convincere per accedere all'Oltretomba. Contiene vari gruppi di ovali con elementi solari e osiriaci.

  ## Le divinità dalla testa di pesce gatto

  Le **divinità dalla testa di pesce gatto** (R1, S2) sono chiamate **Nariu** e sono associate all'iscrizione: "O Nariu, signori del sostentamento, che sono diventati come Osiride...".

  ## La morte di Osiride

  La morte di Osiride è evidenziata dalle **divinità che lo piangono** (R2, S1) e dalle divinità che custodiscono una **cassa contenente il corpo di Osiride** (R3, S2).
secondCavernTitle: Seconda caverna - La caverna del sostentamento
secondDivisionTitle: Seconda Divisione
seventhCavernEsotericMeaning: |-
  ## La settima casa astrologica

  Questa caverna corrisponde alla **settima casa**: la casa delle partnership, del matrimonio, dei nemici aperti e dei contratti legali. Tuttavia, secondo Angelini, **"Della settima casa nulla si può dire poichè non si hanno elementi di discusione"**.

  ## Il passaggio dalla notte al giorno

  La settima caverna rappresenta **il passaggio dalla parte notturna a quella diurna della domificazione**, ovvero quella sotto la linea dell'ascendente e quella sopra la linea dell'ascendente. La completa assenza di questa caverna da tutte le fonti - sia i rilievi dell'Osireion che i papiri - mantiene nascosto il significato esoterico di questa casa di transizione.
seventhCavernLiteralMeaning: |-
  Seguendo l'interpretazione di Angelo Angelini, le **prime sei caverne** corrispondono alle sei sezioni del Libro delle Dodici Caverne dell'Osireion di Abydos, mentre le **altre caverne sono rappresentate solo nei papiri**.

  Secondo questa interpretazione, la Settima Caverna **non ha alcuna attestazione** in nessuna delle due fonti: è assente dai rilievi dell'Osireion e **"Manca nei Papiri"** come Angelini esplicitamente afferma.
seventhCavernTitle: Settima caverna - La caverna della sacra unione
sixthCavernEsotericMeaning: |-
  ## La sesta casa astrologica

  Questa caverna corrisponde alla **sesta casa**: la casa del lavoro, della salute e del servizio, che **termina la zona oscura della domificazione**. È la casa della **sconfitta del caos**, simboleggiata dalle teste decapitate (R3, S1) che rappresentano le forze del disordine definitivamente vinte.

  La Sesta Casa rappresenta il **fulcro della trasformazione spirituale attraverso il sacrificio**. È il luogo dove, mediante la disciplina, il servizio e l'accettazione delle difficoltà, l'individuo sconfigge il caos interiore e può accedere a piani superiori di consapevolezza. Come Ra rinasce ogni mattino dopo aver sconfitto le forze del caos notturno, così il sacrificio diventa strumento di rigenerazione, trasformando la sofferenza in crescita spirituale.
sixthCavernLiteralMeaning: |-
  La Sesta Divisione rappresenta **il compimento del processo di rinascita** iniziato nella quinta divisione. È strutturata in tre registri con tredici scene:

  [TABLE_CAVERNA_6]

  ![Struttura della sesta divisione](sesta_divisione.webp)

  Il tema centrale è la **nascita imminente del dio sole Ra**. Questo è simboleggiato dalla figura dello **scarabeo che emerge da tra due tumuli** (R2, S1), immagine che rappresenta il dio sole che sta per nascere dopo aver completato il suo viaggio notturno attraverso l'Oltretomba.

  La divisione contiene anche altre figure connesse alla rinascita: l'immagine di **Tatenen** (R2, S3), divinità funeraria rappresentante la terra emersa dal Caos primordiale, creatore dell'energia primordiale, **arieti** (R1, S2) e **teste di ariete** (R1, S3 e R2, S3), tutti simboli associati al dio sole e al processo rigenerativo.

  Il registro inferiore mantiene la consueta rappresentazione dei **nemici decapitati** (R3, S1), simboleggiando la sconfitta delle forze del caos che si oppongono alla rinascita solare.
sixthCavernTitle: Sesta caverna - La caverna del servizio
